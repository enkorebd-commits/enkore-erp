<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Client Calls · Enkore</title>
<style>
:root{
  --g:#1b6b3a;--g2:#2d8a52;--gbg:#edf7f1;--red:#e03131;--redbg:#fff5f5;
  --orange:#e67e22;--blue:#1971c2;--bluebg:#e7f1fb;--text:#1a1a2e;--muted:#868e96;
  --border:#dee2e6;--bg:#f3f4f6;--card:#fff;--r:12px;--sh:0 2px 8px rgba(0,0,0,.08);
  --ink:#12181f;--ib:#1e9dd6;--ib-dk:#0f6d9c;--ig:#f4f7fa;--ig2:#e8eef3;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overscroll-behavior:none}

/* HEADER + TABS (mirrors Sales panel) */
.hdr{color:#fff;padding:12px 16px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.2);transition:background .3s}
.hdr.dues{background:#c0392b}
.hdr.sales{background:var(--g)}
.hdr-title{font-size:16px;font-weight:800;letter-spacing:.3px;padding-bottom:10px}

/* PAGE TABS (Due / Follow-up) */
.ptabs{display:flex;gap:8px;padding-bottom:12px}
.ptab{flex:1;text-align:center;padding:9px 6px;border-radius:10px;font-size:12px;font-weight:800;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;transition:.15s;white-space:nowrap}
.ptab.on{background:#fff;color:var(--text)}
.hdr.dues .ptab.on{color:#c0392b}
.hdr.sales .ptab.on{color:var(--g)}

.body{padding:14px;max-width:560px;margin:0 auto}

/* SUMMARY CARD */
.sum{border-radius:var(--r);padding:16px;margin-bottom:12px;color:#fff}
.sum.dues{background:linear-gradient(135deg,#c0392b,#e03131)}
.sum.sales{background:linear-gradient(135deg,#1b6b3a,#2d8a52)}
.sum-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;opacity:.85;margin-bottom:4px}
.sum-amt{font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1}
.sum-sub{font-size:12px;opacity:.85;margin-top:6px}

/* SEARCH */
.search{width:100%;padding:11px 14px;font-size:14px;border:1.5px solid var(--border);border-radius:10px;outline:none;background:#fff;color:var(--text);margin-bottom:12px}
.search:focus{border-color:var(--blue)}

/* LIST */
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:flex-start;gap:12px;background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);cursor:pointer;transition:.12s}
.row:active{transform:scale(.99);background:#fafbfc}
.rank{flex-shrink:0;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;background:#f1f3f5;color:var(--muted)}
.rank.r1{background:#fff3bf;color:#b8860b}
.rank.r2{background:#e9ecef;color:#495057}
.rank.r3{background:#ffe8cc;color:#d9480f}
.row-main{flex:1;min-width:0}
.row-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-loc{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-tel-line{margin-top:5px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.row-tel{display:inline-block;font-size:12px;color:var(--blue);font-weight:800;text-decoration:none;white-space:nowrap}
.row-tel:active{opacity:.6}
.tel-icons{display:flex;align-items:center;gap:8px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;text-decoration:none;flex-shrink:0}
.icon-btn:active{opacity:.7}
.icon-btn.tel-ic{background:var(--blue)}
.icon-btn.tel-ic svg{width:16px;height:16px}
.icon-btn.wa-ic{background:#25D366}
.icon-btn.wa-ic svg{width:16px;height:16px}
.icon-btn.edit-ic{background:#eef1f5;color:#5b6472;font-size:13px}
.tap-hint{font-size:9px;color:#adb5bd;margin-top:6px;font-weight:600;letter-spacing:.3px}
.called-badge{font-size:10px;color:var(--g);font-weight:800;margin-top:4px}
.called-badge.stale{color:var(--muted)}
.row.ignored{opacity:.55}
.ignored-link{text-align:center;font-size:12px;font-weight:800;color:var(--blue);padding:10px;cursor:pointer;background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:8px}
.ignored-link:active{opacity:.7}

/* TRANSACTIONS + LOG-CALL POPUP (shared sheet chrome) */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:flex-end;justify-content:center}
/* Popups can nest: Log Call -> Transaction History -> Edit Number, each one
   opened from inside the last, staying open underneath rather than closing
   it. Explicit per-popup z-index (instead of relying on DOM order, which is
   what caused History to render invisibly BEHIND Log Call before) keeps the
   nested one always on top regardless of where it sits in the HTML. */
#logOv{z-index:500}
#txnOv{z-index:501}
#epOv{z-index:502}
.ov.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:88vh;border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-hd{background:#c0392b;color:#fff;padding:14px 16px;border-radius:18px 18px 0 0;display:flex;align-items:flex-start;gap:10px;position:sticky;top:0}
.sheet-hd.g{background:var(--g)}
.sheet-hd .sh-x{margin-left:auto;font-size:22px;line-height:1;cursor:pointer;opacity:.9;background:none;border:none;color:#fff;padding:0 2px}
.sh-name{font-size:15px;font-weight:800}
.sh-sub{font-size:11px;opacity:.85;margin-top:2px}
.sh-tel{display:inline-block;margin-top:6px;font-size:12px;font-weight:800;color:#fff;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;text-decoration:none}
.sheet-hd .tel-icons{margin-top:8px;min-height:1px}
/* highlighted summary band, visually distinct from the transactions below */
.sheet-chips{display:flex;gap:8px;padding:14px 16px;background:var(--redbg);border-bottom:3px solid #ffd8d0;box-shadow:0 4px 10px rgba(192,57,43,.08)}
.chip{flex:1;text-align:center;background:#fff;border-radius:10px;padding:9px 4px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.chip-l{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.chip-v{font-size:15px;font-weight:900;margin-top:2px}
.chip-v.red{color:var(--red)}
.chip-v.grn{color:var(--g)}
.sheet-sec{padding:12px 16px 2px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 14px 24px;flex:1}
.txn{background:#fff;border-radius:12px;padding:11px 13px;margin-bottom:9px;box-shadow:var(--sh);border-left:4px solid var(--g)}
.txn.pay{border-left-color:var(--blue)}
.txn-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.txn-date{font-size:13px;font-weight:800}
.txn-seller{font-size:10px;color:var(--muted);font-weight:600}
.txn-prod{font-size:11.5px;color:#495057;line-height:1.5;margin-bottom:7px}
.txn-prod-item{padding:1px 0}
.txn-pay-tag{display:inline-block;font-size:11px;font-weight:800;color:var(--blue);background:var(--bluebg);padding:2px 8px;border-radius:6px}
.txn-amts{display:flex;gap:8px;flex-wrap:wrap}
.amt{flex:1;min-width:70px;background:var(--bg);border-radius:8px;padding:6px 8px;text-align:center}
.amt-l{font-size:8.5px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
.amt-v{font-size:13px;font-weight:900;margin-top:1px}
.amt-v.red{color:var(--red)}
.amt-v.grn{color:var(--g)}
.txn-cmt{font-size:10.5px;color:var(--muted);margin-top:6px;font-style:italic}
.sheet-loading,.sheet-empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:13px;font-weight:600}
.row-fig{flex-shrink:0;text-align:right}
.fig-primary{font-size:16px;font-weight:900;line-height:1.1}
.fig-primary.red{color:var(--red)}
.fig-primary.grn{color:var(--g)}
.fig-sec{font-size:10px;color:var(--muted);margin-top:2px;font-weight:600}
.fig-sec.red{color:var(--red)}

/* LOG CALL FORM */
.lc-body{padding:14px 16px 22px}
.lc-lbl{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:14px 0 8px}
.lc-lbl:first-child{margin-top:0}
.outcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.outcome-btn{padding:12px 8px;border-radius:10px;border:1.5px solid var(--border);background:#fff;font-size:12px;font-weight:700;text-align:center;cursor:pointer;line-height:1.3}
.outcome-btn.sel{border-color:var(--blue);background:var(--bluebg);color:var(--blue)}
.lc-history-btn{width:100%;padding:11px;margin-bottom:14px;border:1.5px solid var(--border);border-radius:10px;background:#fff;color:var(--text);font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.lc-history-btn:active{background:#f3f4f6}
.lc-redirects{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.redirect-btn{width:100%;padding:13px 10px;border:none;border-radius:12px;font-size:13px;font-weight:800;color:#fff;cursor:pointer;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.15)}
.redirect-btn:active{opacity:.85}
.redirect-btn[disabled]{opacity:.6}
.rd-blue{background:linear-gradient(135deg,#1971c2,#3b8fe0)}
.rd-green{background:linear-gradient(135deg,#1b6b3a,#2d8a52)}
.lc-or{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;text-align:center;margin:2px 0 10px}
.lc-date,.lc-note,.ep-input{width:100%;padding:11px 12px;font-size:13px;border:1.5px solid var(--border);border-radius:10px;outline:none;background:#fff;color:var(--text);font-family:inherit}
.lc-note{resize:vertical;min-height:64px}
.lc-date-wrap{display:none}
.lc-date-wrap.show{display:block}
.lc-save{width:100%;margin-top:16px;padding:13px;border:none;border-radius:12px;background:var(--blue);color:#fff;font-size:14px;font-weight:800;cursor:pointer}
.lc-save:active{opacity:.85}
.lc-save[disabled]{opacity:.5}

/* STATES */
.state{text-align:center;padding:48px 20px;color:var(--muted)}
.state-icon{font-size:34px;margin-bottom:8px}
.state-txt{font-size:13px;font-weight:600}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #d0d4dc;border-top-color:var(--blue);border-radius:50%;animation:rot .6s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}

/* PULL TO REFRESH */
#ptrIndicator{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;margin-top:-56px;font-size:12px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.96);border:1px solid #e3e7ee;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:250;transition:margin-top .18s ease;pointer-events:none;white-space:nowrap}
#ptrIndicator .ptr-spin{width:16px;height:16px;border:2.5px solid #d0d4dc;border-top-color:var(--blue);border-radius:50%;display:inline-block}
#ptrIndicator.ptr-loading .ptr-spin{animation:rot .6s linear infinite}

/* TOAST */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:400;opacity:0;transition:.25s;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{background:#c0392b}

/* ── TRANSACTION HISTORY — same detailed layout as the Sales panel's
   Previous Transactions view (product lines with rate, per-line discount,
   and a View Invoice button per invoice), so a client's history looks
   identical no matter which panel it's opened from. Chip class names are
   prefixed txn- to avoid clashing with this file's own .chip (used by the
   summary row above). */
.h-item{background:#f8f9fa;border-radius:10px;padding:11px;margin-bottom:8px;border-left:3px solid var(--g)}
.h-item.pay{border-left-color:var(--blue)}
.h-top{display:flex;justify-content:space-between;margin-bottom:8px}
.h-date{font-size:11px;color:var(--muted);font-weight:700}
.h-seller{font-size:10px;color:var(--muted)}
.h-prod-line{font-size:12px;color:var(--text);display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed #e9ecef}
.h-prod-line:last-child{border-bottom:none}
.h-prod-name{flex:1;padding-right:8px}
.h-prod-amt{font-weight:700;white-space:nowrap;color:var(--g)}
.h-prod-list{margin-bottom:8px}
.h-payment-line{font-size:12px;color:var(--blue);font-weight:700;padding:4px 0;margin-bottom:4px}
.h-amts{display:flex;gap:6px}
.txn-chip{flex:1;text-align:center;padding:5px 3px;border-radius:6px}
.txn-chip-lbl{font-size:9px;color:var(--muted);margin-bottom:2px;text-transform:uppercase;letter-spacing:.4px}
.txn-chip-val{font-weight:800;font-size:12px}
.txn-chip-b{background:#e7f5ff;color:var(--blue)}
.txn-chip-p{background:#ebfbee;color:var(--g)}
.txn-chip-d{background:#fff5f5;color:var(--red)}
.h-note{font-size:11px;color:var(--muted);margin-top:7px;padding-top:6px;border-top:1px solid #eee}
.h-inv-btn{margin-top:8px;width:100%;padding:9px;background:var(--g);border:1.5px solid var(--g);color:#fff;border-radius:8px;font-size:12px;font-weight:800;cursor:pointer;letter-spacing:.2px;display:flex;align-items:center;justify-content:center;gap:6px}
.h-inv-btn svg{width:14px;height:14px;flex-shrink:0}
.h-inv-btn:active{background:var(--g2)}

/* Send-all-invoices button, top of the Transaction History popup */
.send-all-inv-btn{width:calc(100% - 32px);padding:10px;margin:12px 16px 2px;background:#25D366;border:none;color:#fff;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.send-all-inv-btn svg{width:16px;height:16px;flex-shrink:0}
.send-all-inv-btn:active{background:#1fb257}
.send-all-inv-btn:disabled{opacity:.6;cursor:default}

/* ── INVOICE OVERLAY — ported from the Sales panel, toolbar fixed at top,
   only .inv-scroll pans/zooms. Sits above every other popup (z-index 900,
   the highest .ov-family popup here is 502) since it can be reached from
   Client Calls' own Transaction History popup. */
.inv-overlay{display:none;position:fixed;inset:0;background:#525659;z-index:900;flex-direction:column}
.inv-overlay.open{display:flex}
.inv-toolbar{flex-shrink:0;z-index:2;background:#323639;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.inv-toolbar-title{color:#fff;font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.inv-toolbar-btns{display:flex;gap:8px;flex-shrink:0}
.inv-print-btn{background:var(--g);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer}
.inv-share-btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer}
.inv-close-btn{background:#4a4e51;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:800;cursor:pointer}
.inv-toolbar-btns button:disabled{opacity:.55;cursor:not-allowed}

.inv-scroll{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:#525659}

.inv-page{background:#fff;width:210mm;min-height:297mm;box-sizing:border-box;margin:16px auto;padding:0 0 14mm;font-family:Arial,Helvetica,sans-serif;color:var(--ink);font-size:12px;box-shadow:0 4px 20px rgba(0,0,0,.3);position:relative;overflow:hidden}
.inv-topbar{height:7px;background:linear-gradient(90deg,var(--ib),var(--ib-dk));margin-bottom:14mm}
.inv-body{padding:0 14mm}
.inv-hr{border:none;border-top:2px solid var(--ink);margin:10px 0 14px}
.inv-hr-thin{border:none;border-top:1px solid #ccc;margin:14px 0}
.inv-header-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.inv-logo{display:block;height:22px;width:auto;flex-shrink:0;border-radius:4px}
.inv-title{font-size:24px;font-weight:900;letter-spacing:1.5px;margin-bottom:4px;color:var(--ink)}
.inv-title-accent{width:44px;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--ib),var(--ib-dk));margin-bottom:9px}
.inv-co-name{font-size:17px;font-weight:800}
.inv-co-line{font-size:11px;color:#555;line-height:1.5}
.inv-co-contact{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#555;margin-top:2px}
.inv-co-contact span{display:inline-flex;align-items:center;gap:4px}
.inv-co-contact svg{flex-shrink:0}
.inv-2col{display:flex;justify-content:space-between;gap:16px;margin-top:16px}
.inv-info-card{background:var(--ig);border-left:3px solid var(--ib);border-radius:0 8px 8px 0;padding:10px 14px;flex:1}
.inv-block-lbl{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px;color:var(--ib-dk)}
.inv-row{font-size:12px;line-height:1.7}
.inv-row b{display:inline-block;min-width:70px;color:#333}
.inv-table{width:100%;border-collapse:collapse;margin-top:18px;font-size:12px;border-radius:8px;overflow:hidden}
.inv-table th{background:var(--ib);color:#fff;padding:var(--tpad,8px) 10px;text-align:left;font-size:var(--tsize,11px);text-transform:uppercase;letter-spacing:.3px}
.inv-table td{padding:var(--tpad,8px) 10px;border-bottom:1px solid #e9ecef;font-size:var(--tsize,12px)}
.inv-table tbody tr:nth-child(even){background:var(--ig)}
.inv-table tr{page-break-inside:avoid}
.inv-table th:last-child,.inv-table td:last-child{text-align:right}
.inv-table th:nth-child(3),.inv-table td:nth-child(3),
.inv-table th:nth-child(4),.inv-table td:nth-child(4),
.inv-table th:nth-child(5),.inv-table td:nth-child(5){text-align:right}
.inv-amounts{width:240px;margin-left:auto;background:var(--ig);border-radius:8px;padding:12px 14px;border:1px solid var(--ig2)}
.inv-amt-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0}
.inv-amt-row.tot{font-weight:900;font-size:14px;color:#fff;background:var(--ib);border-radius:6px;padding:7px 10px;margin:6px -14px}
.inv-amt-row.due{color:#e03131;font-weight:800}
.inv-words{font-size:11px;font-style:italic;color:#333;margin-top:4px}
.inv-sign{margin-top:36px;display:flex;justify-content:flex-end;page-break-inside:avoid}
.inv-sign-box{width:220px;text-align:center}
.inv-sign-for{text-align:right;font-size:12px;color:#333;margin-bottom:2px}
.inv-signature-img{display:block;margin:2px auto 0;height:68px;width:auto;max-width:210px;object-fit:contain}
.inv-sign-line{border-top:1.5px solid var(--ink);margin-top:2px;padding-top:5px;font-size:11px;color:#444}
.inv-footer-tag{text-align:center;margin-top:30px;padding-top:10px;border-top:1px solid var(--ig2)}
.inv-footer-slogan{font-size:10.5px;color:var(--ib-dk);font-weight:700;letter-spacing:.3px}
.inv-footer-web{font-size:10px;color:#8a97a3;font-weight:600;margin-top:2px}

@media print{
  body *{visibility:hidden}
  .inv-overlay,.inv-overlay *{visibility:visible}
  .inv-overlay{position:absolute;inset:0;background:#fff;display:block}
  .inv-toolbar{display:none}
  .inv-scroll{overflow:visible;height:auto}
  .inv-page{box-shadow:none;margin:0;width:210mm;min-height:297mm}
}

/* Off-screen page used only to render each invoice for the "Send All
   Invoices" batch PDF build — never shown to the user, the visible
   invOverlay/#invPage is reserved for the one-at-a-time View Invoice flow. */
#invBatchPage{position:fixed;left:-9999px;top:0}
</style>
</head>
<body>

<div id="ptrIndicator"><span class="ptr-spin"></span><span id="ptrText">Pull to refresh</span></div>

<div class="hdr sales" id="mainHdr">
  <div class="hdr-title" id="hdrTitle">Client Calls</div>
  <div class="ptabs">
    <div class="ptab on" id="tabFollowup" onclick="switchTab('followup')">Follow-up</div>

function tk(n){ if(n===''||n===null||n===undefined) return '৳ 0'; return '৳ '+Number(n||0).toLocaleString('en-IN'); }
// wa.me needs the full international number, digits only, no leading 0/+.

function toWaNumber(phone){
  const d=String(phone||'').replace(/[^0-9]/g,'');

const WA_SVG = '<svg viewBox="0 0 24 24" fill="white"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.85.5 3.58 1.36 5.08L2 22l5.25-1.38a9.87 9.87 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.07c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.13.11-1.82-.11-.42-.13-.96-.31-1.65-.6-2.9-1.25-4.79-4.17-4.93-4.36-.14-.19-1.18-1.57-1.18-3 0-1.42.75-2.12 1.02-2.41.27-.29.58-.36.78-.36.19 0 .39 0 .56.01.18.01.42-.07.66.5.24.58.83 2 .9 2.14.07.15.12.32.02.51-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.28.7 1.16 1.51 1.88 1.04.93 1.92 1.22 2.19 1.36.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.27.36-.22.6-.13.24.09 1.53.72 1.79.85.27.14.44.2.51.32.06.11.06.65-.18 1.32z"/></svg>';
// Plain white call icon, an emoji glyph (📞) is full-color and ignores CSS

const TEL_SVG = '<svg viewBox="0 0 24 24" fill="white"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>';

function telIconsHtml(c, editOnclick){

function parseGviz(txt){ try{ const m=txt.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/); return m?JSON.parse(m[1]):null; }catch(_){ return null; } }
function ordinal(n){ const s=['th','st','nd','rd'],v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtGvizDate(cell){
  if(!cell) return {display:'',ts:0};
  let display=cell.f||String(cell.v||''), ts=0;
  if(cell.v){
    const m=String(cell.v).match(/Date\((\d+),(\d+),(\d+)\)/);
    if(m){ const dt=new Date(+m[1],+m[2],+m[3]); ts=dt.getTime();
      const mos=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      display=`${ordinal(dt.getDate())} ${mos[dt.getMonth()]}, ${String(dt.getFullYear()).slice(-2)}`;
    }
  }
  return {display,ts};
}
function toast(msg, type){ const t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(type==='err'?' err':''); clearTimeout(window._tt); window._tt=setTimeout(()=>t.className='',2200); }
function daysAgo(tsMs){ if(!tsMs) return null; return Math.max(0, Math.floor((Date.now()-tsMs)/86400000)); }

// ── DATA: CLIENTS ────────────────────────────────────────────
async function loadClients(){
  try{
    const c=sessionStorage.getItem(CACHE_KEY);
    if(c){ clients=JSON.parse(c)||[]; render(); }
  }catch(_){}
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=Clients%20Info&t=${Date.now()}`;
    const txt=await fetch(url).then(r=>r.text());
    const rows=(parseGviz(txt)?.table.rows)||[];
    clients=rows.filter(r=>r.c?.[7]?.v).map(r=>({
      name:  r.c[2]?.v||'',
      shop:  r.c[3]?.v||'',
      loc:   r.c[4]?.v||'',
      zone:  r.c[5]?.v||'',
      phone: String(r.c[6]?.v||'').trim(),
      det:   r.c[7]?.v||'',
      sales: Number(r.c[8]?.v)||0,
      paid:  Number(r.c[9]?.v)||0,
      due:   Number(r.c[10]?.v)||0,
      lastOrderDays: (r.c[11]?.v!=null && r.c[11]?.v!=='') ? Number(r.c[11].v) : null,
    }));
    try{ sessionStorage.setItem(CACHE_KEY, JSON.stringify(clients)); }catch(_){}
    applyCallLogs();
    render();
  }catch(e){
    console.error('clients load:', e);
    if(!clients.length){
      document.getElementById('list').innerHTML='<div class="state"><div class="state-icon">⚠️</div><div class="state-txt">Could not load. Pull down to retry.</div></div>';
    }
  }
}

// ── DATA: CALL LOG ───────────────────────────────────────────
async function loadCallLog(){
  if(!CALLLOG_URL || CALLLOG_URL.indexOf('PASTE_')===0) return; // not deployed yet
  try{
    const c=sessionStorage.getItem(CACHE_KEY_CALLS);
    if(c){
      const cached=JSON.parse(c);
      callLogs = Array.isArray(cached) ? cached : (cached.logs||[]); // back-compat with the old bare-array cache shape
      if(cached && !Array.isArray(cached) && cached.remindDayGap>0) FOLLOWUP_THRESHOLD_DAYS=cached.remindDayGap;
      applyCallLogs(); render();
    }
  }catch(_){}
  try{
    const res=await fetch(`${CALLLOG_URL}?action=getCallLog&t=${Date.now()}`).then(r=>r.json());
    if(res && res.success){
      callLogs=res.logs||[];
      if(res.remindDayGap>0) FOLLOWUP_THRESHOLD_DAYS=res.remindDayGap; // live from Remind!B1 — old deploys just omit this field, fallback stays
      try{ sessionStorage.setItem(CACHE_KEY_CALLS, JSON.stringify({logs:callLogs, remindDayGap:FOLLOWUP_THRESHOLD_DAYS})); }catch(_){}
      applyCallLogs();
      render();
    }
  }catch(e){ console.error('call log load:', e); }
}

// Merge call-log "last touch" info onto each client, in place.
function applyCallLogs(){
  if(!clients.length) return;
  const lastByClient = new Map(); // det -> {ts, outcome}
  callLogs.forEach(l=>{
    const t = Date.parse((l.ts||'').replace(' ','T'));
    if(!t) return;
    const prev = lastByClient.get(l.client);
    if(!prev || t>prev.ts) lastByClient.set(l.client, {ts:t, outcome:l.outcome});
  });
  clients.forEach(c=>{
    const last = lastByClient.get(c.det);
    c.lastCallDaysAgo = last ? daysAgo(last.ts) : null;
    c.lastCallOutcome = last ? last.outcome : '';
    c.dismissed = c.lastCallOutcome === DISMISS_OUTCOME;
    const parts=[c.lastOrderDays, c.lastCallDaysAgo].filter(v=>v!=null);
    c.lastTouchDays = parts.length ? Math.min(...parts) : null;
  });
}

// ── RENDER ───────────────────────────────────────────────────
function switchTab(tab){
  if(activeTab===tab) return;
  activeTab=tab;
  document.getElementById('tabDue').classList.toggle('on', tab==='due');
  document.getElementById('tabFollowup').classList.toggle('on', tab==='followup');
  document.getElementById('mainHdr').className='hdr '+(tab==='due'?'dues':'sales');
  document.getElementById('sumCard').className='sum '+(tab==='due'?'dues':'sales');
  render();
}

function toggleIgnored(){
  showIgnored=!showIgnored;
  render();
}

function render(){
  const q=(document.getElementById('search').value||'').trim().toLowerCase();
  const real=clients.filter(c=>(c.name||'').trim().toLowerCase()!=='demo');
  let rows;

  if(activeTab==='due'){
    rows=real.filter(c=>c.due>0);
    if(q) rows=rows.filter(c=>(c.name+' '+c.shop+' '+c.loc+' '+c.zone+' '+c.phone+' '+c.det).toLowerCase().includes(q));
    rows.sort((a,b)=>b.due-a.due);
    const totalDue=real.reduce((s,c)=>s+(c.due>0?c.due:0),0);
    document.getElementById('sumLbl').textContent='Total Outstanding Due';
    document.getElementById('sumAmt').textContent=tk(totalDue);
    document.getElementById('sumSub').textContent=rows.length+' client'+(rows.length===1?'':'s')+' with due';
  }

  let ignoredCount=0;
  if(activeTab==='followup'){
    const allFollowup=real.filter(c=>c.lastTouchDays!=null && c.lastTouchDays>=FOLLOWUP_THRESHOLD_DAYS);
    ignoredCount=allFollowup.filter(c=>c.dismissed).length;
    const active=allFollowup.filter(c=>!c.dismissed);
    rows = showIgnored ? allFollowup : active;
    if(q) rows=rows.filter(c=>(c.name+' '+c.shop+' '+c.loc+' '+c.zone+' '+c.phone+' '+c.det).toLowerCase().includes(q));
    rows.sort((a,b)=>b.lastTouchDays-a.lastTouchDays);
    document.getElementById('sumLbl').textContent='Clients To Call This Week';
    document.getElementById('sumAmt').textContent=String(active.length);
    const over30=active.filter(c=>c.lastTouchDays>=30).length;
    document.getElementById('sumSub').textContent=over30+' silent 30+ days · '+FOLLOWUP_THRESHOLD_DAYS+'-day cadence'+(ignoredCount?' · '+ignoredCount+' ignored':'');
  }

  const el=document.getElementById('list');
  const ignoredLink = (activeTab==='followup' && ignoredCount>0)
    ? '<div class="ignored-link" onclick="toggleIgnored()">'+(showIgnored?'▲ Hide':'👁 Show')+' '+ignoredCount+' ignored client'+(ignoredCount===1?'':'s')+'</div>'
    : '';
  if(!rows.length){
    const emptyMsg = activeTab==='due'
      ? '<div class="state"><div class="state-icon">✅</div><div class="state-txt">No outstanding dues 🎉</div></div>'
      : '<div class="state"><div class="state-icon">✅</div><div class="state-txt">Everyone has been called this week 🎉</div></div>';
    el.innerHTML=ignoredLink+emptyMsg;
    shownRows=[];
    return;
  }
  shownRows=rows;
  el.innerHTML=ignoredLink+rows.map((c,i)=>{
    const rank=i+1;
    const rankCls=rank<=3?('r'+rank):'';
    const sub=[c.shop,c.zone].filter(Boolean).join(' · ');
    const loc=c.loc||c.zone||'';
    const telLine=c.phone
      ? '<div class="tel-icons">'+telIconsHtml(c, null)+'</div>'
      : '<span></span>';
    const calledBadge = c.lastCallDaysAgo!=null
      ? '<div class="called-badge'+(c.lastCallDaysAgo>=FOLLOWUP_THRESHOLD_DAYS?' stale':'')+'">✓ Called '+c.lastCallDaysAgo+'d ago'+(c.lastCallOutcome?' · '+escapeHtml(c.lastCallOutcome):'')+'</div>'
      : '';
    const figHtml = activeTab==='due'
      ? '<div class="row-fig"><div class="fig-primary red">'+tk(c.due)+'</div><div class="fig-sec">Sales '+tk(c.sales)+'</div></div>'
      : (c.dismissed
        ? '<div class="row-fig"><div class="fig-primary" style="color:var(--muted)">🚫</div><div class="fig-sec">ignored</div></div>'
        : '<div class="row-fig"><div class="fig-primary grn">'+c.lastTouchDays+'d</div><div class="fig-sec">since contact</div></div>');
    return '<div class="row'+(c.dismissed?' ignored':'')+'" data-idx="'+i+'">'
      +'<div class="rank '+rankCls+'">'+rank+'</div>'
      +'<div class="row-main"><div class="row-name">'+escapeHtml(c.name||c.shop||'—')+'</div>'
        +(sub?'<div class="row-sub">'+escapeHtml(sub)+'</div>':'')
        +(loc?'<div class="row-loc">📍 '+escapeHtml(loc)+'</div>':'')
        +'<div class="row-tel-line">'+telLine+'</div>'
        +calledBadge
      +'</div>'
      +figHtml
      +'</div>';
  }).join('');
}

// ── TRANSACTIONS POPUP ───────────────────────────────────────
function groupTxns(rows){
  // Grouping key: Invoice No when the row has one (one invoice = one number,
  // matches Sales panel exactly). Falls back to Date for payment-only rows
  // or pre-backfill legacy rows with no Invoice No yet.
  const groups=[], seen=new Map();
  rows.forEach(r=>{
    const key=r.invoiceNo?('inv_'+r.invoiceNo):(r.dateDisplay||String(r.dateTs));
    if(!seen.has(key)){
      const g={dateDisplay:r.dateDisplay,dateTs:r.dateTs,invoiceNo:r.invoiceNo||'',seller:'',products:[],totalBill:0,totalPaid:0,due:undefined,prevDue:undefined,comment:''};
      seen.set(key,g); groups.push(g);
    }
    const g=seen.get(key);
    if(r.seller)  g.seller=r.seller;
    if(r.comment) g.comment=r.comment;
    if(g.prevDue===undefined && r.prevDue!==undefined) g.prevDue=r.prevDue; // first row of the group
    if(r.prod){ g.products.push({name:r.prod,rate:r.rate,qty:r.qty,discount:r.disc||0,final:r.final||r.bill}); g.totalBill+=(r.final||r.bill||0); }
    if(r.paid) g.totalPaid+=r.paid;
    if(r.due!==undefined) g.due=r.due;
  });
  return groups.reverse();
}

  document.getElementById('shDue').textContent  =tk(c.due);
  document.getElementById('shBody').innerHTML='<div class="sheet-loading"><span class="spin"></span> Loading transactions…</div>';
  ovOpen('txnOv');
  document.body.style.overflow='hidden';

  try{

function numToWordsTaka(num) {
  num = Math.round(Number(num) || 0);
  if (num === 0) return 'Zero Taka Only';
  const ones = ['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten',
    'Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens = ['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function twoDigit(n) {
    if (n < 20) return ones[n];
    return tens[Math.floor(n/10)] + (n%10 ? ' ' + ones[n%10] : '');
  }
  function threeDigit(n) {
    if (n < 100) return twoDigit(n);
    return ones[Math.floor(n/100)] + ' Hundred' + (n%100 ? ' ' + twoDigit(n%100) : '');
  }
  let crore = Math.floor(num / 10000000); num %= 10000000;
  let lakh  = Math.floor(num / 100000);    num %= 100000;
  let thou  = Math.floor(num / 1000);      num %= 1000;
  let rest  = num;
  let parts = [];
  if (crore) parts.push(threeDigit(crore) + ' Crore');
  if (lakh)  parts.push(threeDigit(lakh)  + ' Lakh');
  if (thou)  parts.push(threeDigit(thou)  + ' Thousand');
  if (rest)  parts.push(threeDigit(rest));
  return parts.join(' ') + ' Taka Only';
}

// ── PINCH-ZOOM: loosened only while the invoice is open ──────────
const DEFAULT_VIEWPORT = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no';
const ZOOM_VIEWPORT     = 'width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes';
function enableInvoiceZoom()  { document.querySelector('meta[name=viewport]')?.setAttribute('content', ZOOM_VIEWPORT); }
function disableInvoiceZoom() { document.querySelector('meta[name=viewport]')?.setAttribute('content', DEFAULT_VIEWPORT); }

function autoFitInvoicePage(page) {
  if (!page) return;
  page.style.setProperty('--tsize', '12px');
  page.style.setProperty('--tpad', '7px');

  const rect = page.getBoundingClientRect();
  if (!rect.width) return;
  const pxPerMM = rect.width / 210;
  const maxHeightPx = pxPerMM * 297;

  let tsize = 12, tpad = 7;
  const minSize = 8.5, minPad = 3;
  let guard = 0;

  while (page.scrollHeight > maxHeightPx && (tsize > minSize || tpad > minPad) && guard < 40) {
    if (tpad > minPad)  tpad -= 0.5;
    else if (tsize > minSize) tsize -= 0.25;
    page.style.setProperty('--tpad',  tpad  + 'px');
    page.style.setProperty('--tsize', tsize + 'px');
    guard++;
  }
}

function fitInvoiceToScreen() {
  const scroll = document.getElementById('invScroll');
  const page   = document.getElementById('invPage');
  if (!scroll || !page || !document.getElementById('invOverlay').classList.contains('open')) return;

  page.style.zoom = 1;
  const availW = scroll.clientWidth  - 16;
  const availH = scroll.clientHeight - 16;
  const trueW  = page.offsetWidth;
  const trueH  = page.offsetHeight;
  if (!trueW || !trueH) return;

  const fit = Math.min(availW / trueW, availH / trueH, 1);
  page.style.zoom = fit;
  window._invFitZoom = fit;
}

function printInvoice() {
  const page = document.getElementById('invPage');
  const fitZoom = window._invFitZoom || 1;
  page.style.zoom = 1;
  autoFitInvoicePage(page);
  const oldTitle = document.title;
  document.title = window._invFileBase || document.title;
  const restoreAfterPrint = () => {
    document.title = oldTitle;
    page.style.zoom = fitZoom;
    window.removeEventListener('afterprint', restoreAfterPrint);
  };
  window.addEventListener('afterprint', restoreAfterPrint);
  setTimeout(() => window.print(), 30);
}

// ── REAL PDF FILE — for direct WhatsApp / Messenger / any app share ──
function waitForInvoiceImages(page) {
  const imgs = Array.from(page.querySelectorAll('img'));
  return Promise.all(imgs.map(img => {
    if (img.complete && img.naturalWidth > 0) return Promise.resolve();
    return new Promise(res => {
      img.addEventListener('load', res, { once: true });
      img.addEventListener('error', res, { once: true });
      setTimeout(res, 3000);
    });
  }));
}

// Renders `page` (already filled with buildInvoiceHtml output) to a real A4
// PDF blob. Used both for the single on-screen invoice (#invPage) and for
// each invoice in the "Send All" batch (#invBatchPage).
async function renderPageToPdf(page, invoiceNo, fileBase) {
  await waitForInvoiceImages(page);
  await new Promise(r => requestAnimationFrame(r));
  const canvas = await html2canvas(page, { scale: 1.25, useCORS: true, backgroundColor: '#ffffff' });
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p', 'mm', 'a4');
  const docTitle = `ENKORE Invoice ${invoiceNo || ''}`.trim();
  doc.setProperties({ title: docTitle, subject: 'Invoice', creator: 'Enkore Automotive Ltd.' });

  const pageW = 210, pageH = 297;
  const imgH  = (canvas.height * pageW) / canvas.width;
  const imgData = canvas.toDataURL('image/jpeg', 0.88);

  if (imgH <= pageH) {
    doc.addImage(imgData, 'JPEG', 0, 0, pageW, imgH);
  } else {
    let renderedMM = 0;
    while (renderedMM < imgH) {
      if (renderedMM > 0) doc.addPage();
      doc.addImage(imgData, 'JPEG', 0, -renderedMM, pageW, imgH);
      renderedMM += pageH;
    }
  }
  const filename = (fileBase || 'ENKORE Invoice') + '.pdf';
  return { blob: doc.output('blob'), filename };
}

async function buildInvoicePDF() {
  const page = document.getElementById('invPage');
  const fitZoom = window._invFitZoom || 1;
  page.style.zoom = 1;
  const built = await renderPageToPdf(page, window._invInvoiceNo, window._invFileBase);
  page.style.zoom = fitZoom;
  return built;
}

async function shareInvoicePDF() {
  const btn = document.getElementById('invShareBtn');
  const original = btn.innerHTML;

  let built = window._invPdfReady ? await window._invPdfReady : null;
  if (!built) {
    btn.disabled = true; btn.innerHTML = '⏳ Preparing…';
    built = await buildInvoicePDF().catch(() => null);
    btn.disabled = false; btn.innerHTML = original;
  }
  if (!built) { toast('Could not prepare PDF', 'err'); return; }

  try {
    const { blob, filename } = built;
    const file = new File([blob], filename, { type: 'application/pdf' });

    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast(`Saved as ${filename}, share it from your Files/Downloads app`, 'ok');
    }
  } catch (e) {
    if (e?.name !== 'AbortError') {
      console.error('Share PDF failed:', e);
      toast('Could not prepare PDF', 'err');
    }
  } finally {
    btn.disabled = false; btn.innerHTML = original;
  }
}

// ── SEND ALL INVOICES VIA WHATSAPP ────────────────────────────────
// Builds one PDF per invoice this client has (off-screen, via
// #invBatchPage so the visible invoice viewer isn't disturbed), then hands
// all of them to the phone's native share sheet in one go. WhatsApp itself
// has no API for Claude/the ERP to push a message straight into a chat —
// this is the same OS share-sheet handoff the single "Share" button uses,
// just bundled for every invoice at once. Sir still picks WhatsApp and the
// contact on the share sheet, same one tap as sharing a single invoice.
async function buildInvoicePdfForGroup(g, c) {
  const page = document.getElementById('invBatchPage');
  page.innerHTML = buildInvoiceHtml(g, c);
  page.style.setProperty('--tsize', '12px');
  page.style.setProperty('--tpad', '7px');
  await new Promise(r => requestAnimationFrame(r));
  autoFitInvoicePage(page);
  return renderPageToPdf(page, g.invoiceNo, `ENKORE_Invoice_${g.invoiceNo}`);
}

async function sendAllInvoicesWA() {
  if (!hClient) return;
  const groups = (window._histGroups || []).filter(g => g.invoiceNo);
  if (!groups.length) { toast('No invoices found for this client', 'err'); return; }

  const btn = document.getElementById('sendAllInvBtn');
  const original = btn.innerHTML;
  btn.disabled = true;

  try {
    const files = [];
    for (let i = 0; i < groups.length; i++) {
      btn.innerHTML = `⏳ Preparing invoice ${i+1} of ${groups.length}…`;
      const { blob, filename } = await buildInvoicePdfForGroup(groups[i], hClient);
      files.push(new File([blob], filename, { type: 'application/pdf' }));
    }
    document.getElementById('invBatchPage').innerHTML = '';

    if (navigator.canShare && navigator.canShare({ files })) {
      await navigator.share({ files, title: `${hClient.name || 'Client'} Invoices` });
    } else {
      files.forEach(f => {
        const url = URL.createObjectURL(f);
        const a = document.createElement('a');
        a.href = url; a.download = f.name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      });
      toast(`Saved ${files.length} invoice(s) to Downloads, attach them in WhatsApp`, 'ok');
    }
  } catch (e) {
    if (e?.name !== 'AbortError') {
      console.error('Send all invoices failed:', e);
      toast('Could not prepare invoices', 'err');
    }
  } finally {
    btn.disabled = false; btn.innerHTML = original;
  }
}

  const params=new URLSearchParams({
    action:'addCallLog', client:det, sellerId:USER_ID, sellerName:USER_NAME,

  // Optimistic: the screen updates the instant you tap Save. The sheet

  // queued and retried automatically — same pattern as the offline queues
  // already used on the Sales panel.
  callLogs.push({ts:new Date().toISOString().slice(0,19).replace('T',' '), logId:'pending_'+submitId, client:det, sellerId:USER_ID, sellerName:USER_NAME, source, outcome, note, nextDate});
  try{ sessionStorage.setItem(CACHE_KEY_CALLS, JSON.stringify({logs:callLogs, remindDayGap:FOLLOWUP_THRESHOLD_DAYS})); }catch(_){}
  applyCallLogs();
  toast('✅ Call logged');
  closeLogCall();
  render();

  syncCallLog(params.toString());
}

async function syncCallLog(qs){
  try{
    const res=await fetch(CALLLOG_URL+'?'+qs, {keepalive:true}).then(r=>r.json());
    if(!res || !res.success) throw new Error((res&&res.error)||'save failed');
  }catch(e){
    console.error('call log sync failed, queued for retry:', e);
    queueCallLog(qs);
  }
}

// ── CALL LOG RETRY QUEUE (offline / weak signal) ─────────────────
// Mirrors the sale-entry / note-status retry queues in sales-entry.html:
// a failed write is never just lost, it's kept in localStorage and retried
// on the next load or the next 'online' event.
const CALLLOG_QUEUE_KEY = 'enkore_pending_calllog';

function queueCallLog(qs){
  try{
    const q=JSON.parse(localStorage.getItem(CALLLOG_QUEUE_KEY)||'[]');
    if(!q.some(e=>e.qs===qs)){
      q.push({qs, savedAt:Date.now()});
      localStorage.setItem(CALLLOG_QUEUE_KEY, JSON.stringify(q));
    }
  }catch(_){}
}

function dequeueCallLog(qs){
  try{
    const q=JSON.parse(localStorage.getItem(CALLLOG_QUEUE_KEY)||'[]');
    localStorage.setItem(CALLLOG_QUEUE_KEY, JSON.stringify(q.filter(e=>e.qs!==qs)));
  }catch(_){}
}

async function flushCallLogQueue(){
  if(!CALLLOG_URL || CALLLOG_URL.indexOf('PASTE_')===0) return;
  try{
    const q=JSON.parse(localStorage.getItem(CALLLOG_QUEUE_KEY)||'[]');
    if(!q.length) return;
    let synced=0;
    for(const entry of [...q]){
      try{
        const js=await fetch(`${CALLLOG_URL}?${entry.qs}`).then(r=>r.json());
        if(js && js.success){ dequeueCallLog(entry.qs); synced++; }
        else break; // server error — stop, don't retry yet
      }catch(_){ break; } // still offline — stop
    }
    if(synced>0) toast(`✅ ${synced} call log entry/entries synced`,'ok');
  }catch(_){}
}

function closeLogCall(){
  ovClose('logOv');
  document.body.style.overflow='';
  lcClient=null;
}

// Reached from the "📋 Transaction History" button at the top of the Log
// Call popup. Opens ON TOP of Log Call, logOv stays open underneath so
// closing History (X or Back) returns to it, closing Log Call after that
// returns to the client list, a proper 3-step navigation stack. Visibility
// is guaranteed by the explicit #txnOv/#logOv z-index above, not DOM order.
function openHistoryFromLog(){ if(lcClient) openHistory(lcClient); }

// ── EDIT CLIENT PHONE ───────────────────────────────────────
// Scope: phone number only, same rule and same backend action as the
// Sales panel's edit button (Not For GitHub/Sales Panel Apps Script/Code.gs,
// updateClientPhone). Name/Shop/Location/Zone stay locked, they make up
// "det", the join key used across Sale Entry, Sales Notes and Call Log.
let epClient = null, _epSubmitting = false;

// Reached from inside the Log Call and Transaction History popups (the icon row
// there now matches the row list: call, WhatsApp, edit), not from the row list itself.
function openEditPhoneFromLog(){ if(lcClient) openEditPhone(lcClient); }
function openEditPhoneFromHistory(){ if(hClient) openEditPhone(hClient); }

function openEditPhone(c){
  epClient = c;
  document.getElementById('epSub').textContent = [c.name, c.shop].filter(Boolean).join(' · ') || '—';
  document.getElementById('epPhone').value = c.phone || '';
  _epSubmitting = false;
  ovOpen('epOv');
  document.body.style.overflow='hidden';
}

function closeEditPhone(){
  ovClose('epOv');
  epClient = null;
  // epOv can be nested on top of the Log Call or Transaction History popup
  // (opened via their own edit icon), don't release the scroll lock while
  // that parent popup is still open underneath.
  const logOpen = document.getElementById('logOv').classList.contains('open');
  const histOpen = document.getElementById('txnOv').classList.contains('open');
  if(!logOpen && !histOpen) document.body.style.overflow='';
}

// Re-paints the call/WhatsApp/edit icon row inside whichever popup(s) the
// just-edited client is currently shown in, so the tel:/wa.me links don't
// keep pointing at the old number after a save.
function refreshOpenPopupIcons(det){
  if(lcClient && lcClient.det===det) document.getElementById('lcTelIcons').innerHTML=telIconsHtml(lcClient,'openEditPhoneFromLog()');
  if(hClient && hClient.det===det) document.getElementById('shTelIcons').innerHTML=telIconsHtml(hClient,'openEditPhoneFromHistory()');
}

async function saveEditPhone(){
  if(_epSubmitting) return;
  if(!epClient) return;
  const phone = document.getElementById('epPhone').value.trim();
  if(!phone){ toast('Enter mobile number','err'); return; }
  if(!AS_URL || AS_URL.indexOf('PASTE_')===0){ toast('Sales panel not connected, ask Chayan','err'); return; }
  _epSubmitting = true;

  const det = epClient.det;
  const oldPhone = epClient.phone || '';
  const idx = clients.findIndex(c=>c.det===det);

  // ── INSTANT UX: update locally and close right now ──
  epClient.phone = phone;
  if(idx>=0) clients[idx].phone = phone;
  try{ sessionStorage.setItem(CACHE_KEY, JSON.stringify(clients)); }catch(_){}
  toast('✅ Number updated!','ok');
  closeEditPhone();
  refreshOpenPopupIcons(det);
  render();
  _epSubmitting = false;

  // ── BACKGROUND: save to sheet ──
  try{
    const submitId='up_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    const qs=new URLSearchParams({action:'updateClientPhone', det, phone, submitId}).toString();
    const js=await fetch(`${AS_URL}?${qs}`).then(r=>r.json());
    if(!js || !js.success){
      if(idx>=0) clients[idx].phone = oldPhone;
      try{ sessionStorage.setItem(CACHE_KEY, JSON.stringify(clients)); }catch(_){}
      refreshOpenPopupIcons(det);
      render();
      toast('❌ Could not update, check connection','err');
    }
  }catch(e){
    console.error('Background phone update:', e);
    toast('⚠️ Sheet save failed, retry by reopening the app','err');
  }
}

// ── REDIRECT ACTIONS (Will Reorder / Payment Collected) ─────────
// Instant by design: navigate the moment the button is tapped, no waiting
// on the network first. The call-log write is fire-and-forget with
// keepalive:true so it still reaches the server even though this frame
// unloads a moment later (keepalive is exactly what that flag is for).
// If it fails, the redirect still happens, since the real action (the
// note or the payment) matters more than this best-effort audit trail.
function redirectAction(kind){
  if(!lcClient) return;
  const outcome = kind==='payment' ? 'Payment Collected' : 'Will Reorder';
  const note = document.getElementById('lcNote').value.trim();
  const det = lcClient.det;

  if(CALLLOG_URL && CALLLOG_URL.indexOf('PASTE_')!==0){
    const submitId='cl_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    const params=new URLSearchParams({
      action:'addCallLog', client:det, sellerId:USER_ID, sellerName:USER_NAME,
      source:activeTab, outcome, note, nextDate:'', submitId
    });
    try{ fetch(CALLLOG_URL+'?'+params.toString(), {keepalive:true}).catch(()=>{}); }catch(_){}
  }

  if(parent && typeof parent.__erpGoTo==='function'){
    parent.__erpGoTo('sales-entry','Sales',{det:det, action:kind});
  }else{
    toast('Cannot open Sales panel from here','err');
  }
}

// ── SHELL POPUP REGISTRATION ──
function ovOpen(id){
  const el=document.getElementById(id);
  if(!el||el.classList.contains('open')) return;
  el.classList.add('open');
  try{ if(parent&&parent.__erpOv) parent.__erpOv(); }catch(_){}
}
function ovClose(id){
  const el=document.getElementById(id);
  if(!el||!el.classList.contains('open')) return;
  el.classList.remove('open');
  try{ if(parent&&parent.__erpOvClose) parent.__erpOvClose(); }catch(_){}
}

// ── PULL TO REFRESH ──────────────────────────────────────────
async function forceRefresh(){
  if(_ptrBusy) return;
  _ptrBusy=true;
  const ind=document.getElementById('ptrIndicator');
  ind.classList.add('ptr-loading');
  document.getElementById('ptrText').textContent='Refreshing…';
  try{ sessionStorage.removeItem(CACHE_KEY); sessionStorage.removeItem(CACHE_KEY_CALLS); }catch(_){}
  try{ await Promise.all([loadClients(), loadCallLog()]); toast('✅ Refreshed'); }
  catch(e){ toast('Refresh failed','err'); }
  finally{
    _ptrBusy=false;
    ind.classList.remove('ptr-loading');
    document.getElementById('ptrText').textContent='Pull to refresh';
  }
}

function initPullToRefresh(){
  const ind=document.getElementById('ptrIndicator');
  const txt=document.getElementById('ptrText');
  const MAX=90, FIRE=60;
  let startY=0, pulling=false, dist=0;
  document.addEventListener('touchstart', e=>{
    if(_ptrBusy||window.scrollY>0){ pulling=false; return; }
    startY=e.touches[0].clientY; pulling=true;
  },{passive:true});
  document.addEventListener('touchmove', e=>{
    if(!pulling||_ptrBusy) return;
    dist=e.touches[0].clientY-startY;
    if(dist<=0){ dist=0; ind.style.marginTop='-56px'; return; }
    if(window.scrollY>0){ pulling=false; return; }
    const eased=Math.min(MAX,dist*0.5);
    ind.style.marginTop=(eased-56)+'px';
    txt.textContent=eased>=FIRE?'Release to refresh':'Pull to refresh';
  },{passive:true});
  document.addEventListener('touchend', ()=>{
    if(!pulling) return;
    pulling=false;
    const eased=Math.min(MAX,dist*0.5);
    if(eased>=FIRE){ ind.style.marginTop='0px'; forceRefresh().then(()=>{ ind.style.marginTop='-56px'; }); }
    else ind.style.marginTop='-56px';
    dist=0;
  });
}

// ── INIT ─────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', ()=>{
  loadClients();
  loadCallLog();
  flushCallLogQueue();
  window.addEventListener('online', ()=>{ flushCallLogQueue(); });
  initPullToRefresh();
  document.getElementById('list').addEventListener('click', e=>{
    if(e.target.closest('.icon-btn')) return;
    const row=e.target.closest('.row'); if(!row) return;
    const c=shownRows[+row.dataset.idx]; if(!c) return;
    // Tapping the card opens Log Call (all actions live there now, including
    // Transaction History via its own button). Read-only viewers can't log
    // calls, so their tap just opens History directly instead.
    if(READONLY) openHistory(c); else openLogCall(c);
  });
  document.getElementById('txnOv').addEventListener('click', e=>{
    if(e.target.id==='txnOv') closeHistory();
  });
  document.getElementById('logOv').addEventListener('click', e=>{
    if(e.target.id==='logOv') closeLogCall();
  });
});

// ── SHELL BACK-BUTTON HOOK ──
window.__erpHandleBack = function() {
  // Closest-first: Invoice -> Edit Number -> Transaction History -> Log Call
  // can all be open at once (each opened from inside the last, staying open
  // underneath), so Back/X on any one of them must only close that single
  // topmost popup and reveal whichever one is still open beneath it.
  const inv = document.getElementById('invOverlay');
  if (inv && inv.classList.contains('open')) { closeInvoice(); return true; }
  const ep = document.getElementById('epOv');
  if (ep && ep.classList.contains('open')) { closeEditPhone(); return true; }
  const ov = document.getElementById('txnOv');
  if (ov && ov.classList.contains('open')) { closeHistory(); return true; }
  const lo = document.getElementById('logOv');
  if (lo && lo.classList.contains('open')) { closeLogCall(); return true; }
  return false;
};
