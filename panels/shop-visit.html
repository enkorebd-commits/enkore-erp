<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shop Visit - Enkore</title>
<style>
:root{
  --blue:#1971c2;--blue2:#4098e6;--bluebg:#e7f1fb;
  --grn:#1b6b3a;--grnbg:#edf7f1;--red:#e03131;--redbg:#fff5f5;
  --amber:#e67e22;--amberbg:#fff4e6;--grey:#868e96;
  --text:#1a1a2e;--muted:#868e96;--border:#dee2e6;--bg:#f3f4f6;--card:#fff;
  --r:14px;--sh:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overscroll-behavior:none}
svg{display:block}

#ptrIndicator{position:fixed;top:8px;left:50%;transform:translate(-50%,0);margin-top:-56px;z-index:50;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.96);border-radius:999px;box-shadow:0 2px 10px rgba(0,0,0,.18);padding:7px 14px;font-size:12px;font-weight:700;color:var(--text);pointer-events:none}
.ptr-spin{width:16px;height:16px;border:2.5px solid #d0d4dc;border-top-color:var(--blue);border-radius:50%;display:inline-block}
#ptrIndicator.ptr-loading .ptr-spin{animation:rot .6s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.hdr{background:linear-gradient(135deg,#123a63,#1971c2);color:#fff;padding:20px 16px 16px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-t{font-size:21px;font-weight:900;letter-spacing:.2px}
.hdr-s{font-size:12.5px;font-weight:600;margin-top:6px;opacity:.92;line-height:1.45}

.body{padding:14px;max-width:560px;margin:0 auto;padding-bottom:60px}
.sec-t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 4px 8px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:10px}

/* gps */
.gps{display:flex;align-items:center;gap:11px}
.gps-ic{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--bluebg);color:var(--blue)}
.gps.ok .gps-ic{background:var(--grnbg);color:var(--grn)}
.gps.bad .gps-ic{background:var(--redbg);color:var(--red)}
.gps.weak .gps-ic{background:var(--amberbg);color:var(--amber)}
.gps.wait .gps-ic svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.gps-m{flex:1;min-width:0}
.gps-h{font-size:13.5px;font-weight:800}
.gps-s{font-size:11.5px;color:var(--muted);margin-top:2px;line-height:1.4}
.gps-b{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:8px 11px;font-size:12px;font-weight:800;color:var(--blue)}

/* form */
label.f{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:12px 2px 5px}
label.f:first-child{margin-top:0}
label.f .req{color:var(--red)}
input[type=text],input[type=tel],input[type=date],textarea{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:12px;font-size:15px;font-family:inherit;color:var(--text);background:#fff;outline:none;appearance:none;-webkit-appearance:none}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1.5px solid var(--border);background:#fff;border-radius:999px;padding:9px 14px;font-size:13px;font-weight:800;color:var(--text)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.chip.hot.on{background:var(--red);border-color:var(--red)}
.chip.warm.on{background:var(--amber);border-color:var(--amber)}
.chip.cold.on{background:var(--grey);border-color:var(--grey)}

.photo-row{display:flex;align-items:center;gap:12px}
.photo-btn{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--blue);background:var(--bluebg);color:var(--blue);border-radius:11px;padding:12px 14px;font-size:13px;font-weight:800}
.photo-prev{position:relative;width:74px;height:74px;border-radius:11px;overflow:hidden;background:var(--bg)}
.photo-prev img{width:100%;height:100%;object-fit:cover}
.photo-x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:13px;font-weight:900;line-height:22px;text-align:center}

.save{width:100%;margin-top:16px;border:none;border-radius:12px;padding:15px;font-size:15.5px;font-weight:900;color:#fff;background:linear-gradient(135deg,#1b6b3a,#2d8a52);box-shadow:0 4px 12px rgba(27,107,58,.3)}
.save:disabled{background:#c4c9d0;box-shadow:none}

/* queue banner */
.q{display:none;background:var(--amberbg);border:1.5px solid #f3c58a;color:#8a4b08;border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:12.5px;font-weight:700;line-height:1.45}
.q.show{display:block}
.q b{font-weight:900}
.q-row{display:flex;gap:8px;margin-top:8px}
.q-btn{border:none;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:800;background:#8a4b08;color:#fff}
.q-btn.alt{background:#fff;color:#8a4b08;border:1.5px solid #f3c58a}

/* my visits */
.search{margin-bottom:10px}
.day{font-size:11px;font-weight:800;color:var(--muted);margin:12px 4px 6px;text-transform:uppercase;letter-spacing:.6px}
.v{display:flex;gap:11px;align-items:center;background:var(--card);border-radius:12px;box-shadow:var(--sh);padding:11px 12px;margin-bottom:7px}
.dot{width:30px;height:30px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
.dot.Hot{background:var(--red)}.dot.Warm{background:var(--amber)}.dot.Cold{background:var(--grey)}
.v-m{flex:1;min-width:0}
.v-n{font-size:13.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-s{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10px;font-weight:800;border-radius:999px;padding:2px 8px;background:var(--amberbg);color:#8a4b08;flex-shrink:0}
.tag.fail{background:var(--redbg);color:var(--red)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 10px;font-weight:600}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);opacity:0;background:#1a1a2e;color:#fff;border-radius:999px;padding:11px 18px;font-size:13px;font-weight:700;z-index:60;max-width:90%;text-align:center;transition:all .25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red)}
#toast.ok{background:var(--grn)}
.ro{background:var(--amberbg);color:#8a4b08;border-radius:12px;padding:12px;font-weight:700;font-size:13px;margin-bottom:10px}

    @media (min-width:769px){
      body, .body { max-width:1040px; width:100%; margin-left:auto; margin-right:auto; }
    }
</style>
</head>
<body>
<div id="ptrIndicator"><span class="ptr-spin"></span><span id="ptrText">Pull to refresh</span></div>

<div class="hdr">
  <div class="hdr-t">Shop Visit</div>
  <div class="hdr-s" id="hdrSub">Log the shop while you are standing in it. Location, details, photo, done.</div>
</div>

<div class="body">
  <div id="roMsg" class="ro" style="display:none">This account is view only, so visits cannot be saved.</div>

  <div id="qBanner" class="q"></div>

  <div class="card" id="gpsCard">
    <div class="gps wait" id="gps">
      <div class="gps-ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
      <div class="gps-m"><div class="gps-h" id="gpsH">Finding your location</div><div class="gps-s" id="gpsS">Keep this page open for a few seconds</div></div>
      <button class="gps-b" id="gpsBtn" type="button">Retry</button>
    </div>
  </div>

  <div class="card">
    <label class="f">Shop name <span class="req">*</span></label>
    <input type="text" id="fShop" maxlength="120" autocomplete="off" placeholder="e.g. Rahim Motors">

    <label class="f">Owner name</label>
    <input type="text" id="fOwner" maxlength="80" autocomplete="off" placeholder="Person you met">

    <label class="f">Phone</label>
    <input type="tel" id="fPhone" maxlength="20" autocomplete="off" inputmode="tel" placeholder="01XXXXXXXXX">

    <label class="f">Shop type</label>
    <div class="chips" id="cType"></div>

    <label class="f">Interest level</label>
    <div class="chips" id="cInt"></div>

    <label class="f">Products they stock or want</label>
    <input type="text" id="fProd" maxlength="200" autocomplete="off" placeholder="e.g. Chain lube, tire sealant">

    <label class="f">Address or landmark</label>
    <input type="text" id="fAddr" maxlength="200" autocomplete="off" placeholder="e.g. Beside the bus stand">

    <label class="f">Next visit date</label>
    <input type="date" id="fNext">

    <label class="f">Notes</label>
    <textarea id="fNotes" maxlength="500" placeholder="What did they say? What do they need?"></textarea>

    <label class="f">Shop photo (optional)</label>
    <div class="photo-row">
      <label class="photo-btn" for="fPhoto"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="photoLbl">Take photo</span></label>
      <input type="file" id="fPhoto" accept="image/*" capture="environment" style="display:none">
      <div class="photo-prev" id="photoPrev" style="display:none"><img id="photoImg" alt=""><button type="button" class="photo-x" id="photoX" aria-label="Remove photo">x</button></div>
    </div>

    <button class="save" id="saveBtn" type="button" disabled>Save visit</button>
  </div>

  <div class="sec-t">My visits</div>
  <input type="text" id="search" class="search" placeholder="Search shop, owner, phone, address, notes" autocomplete="off">
  <div id="list"></div>
</div>
<div id="toast"></div>

<script>
const API   = 'https://script.google.com/macros/s/AKfycbylAEyTwyBrejsLKA1a5-dhL57K44UVUJOT9rDvLtd53GSzR-WEEAMYD-WYVx7SpGUaJA/exec';
const PARAMS   = new URLSearchParams(location.search);
const USER_ID  = PARAMS.get('userId') || '';
const USER_NAME= PARAMS.get('name') || '';
const READONLY = PARAMS.get('readonly') === '1';
const QKEY  = 'enkore_shopvisit_queue_' + USER_ID;
const CKEY  = 'enkore_shopvisit_mine_' + USER_ID;
const TYPES = ['Bike shop','Garage','Tire shop','Spare parts','Showroom','Other'];
const INTS  = ['Hot','Warm','Cold'];

let FIX = null, watchId = null, TYPE = 'Bike shop', INTEREST = 'Warm', PHOTO = '';
let MINE = [], QUEUE = [], _ptrBusy = false, _syncing = false, _saving = false;

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg, kind){ const t=$('toast'); t.textContent=msg; t.className='show '+(kind||''); clearTimeout(toast._t); toast._t=setTimeout(()=>{t.className='';},2800); }
function lsGet(k, d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } }

/* ---------- GPS ---------- */
function setGps(state, h, s){
  const g=$('gps'); g.className='gps '+state;
  $('gpsH').textContent=h; $('gpsS').textContent=s;
}
function startGPS(){
  if(!navigator.geolocation){ setGps('bad','No GPS on this phone','Use a phone with location support'); return; }
  stopGPS(); FIX=null; refreshSave();
  setGps('wait','Finding your location','Keep this page open for a few seconds');
  watchId = navigator.geolocation.watchPosition(p=>{
    const f={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy||0,ts:Date.now()};
    if(!FIX || f.acc<=FIX.acc*1.5 || Date.now()-FIX.ts>15000) FIX=f;
    const a=Math.round(FIX.acc);
    if(a<=60) setGps('ok','Location locked, within '+a+' m','Good to save');
    else if(a<=200) setGps('weak','Location is rough, within '+a+' m','Step outside the shop for a better signal, or save anyway');
    else setGps('weak','Weak signal, within '+a+' m','Move near a window or outside and wait');
    refreshSave();
  }, err=>{
    if(err.code===1) setGps('bad','Location is blocked','Allow location for this app in your phone browser settings, then tap Retry');
    else setGps('bad','Cannot get location','Check that GPS is on, then tap Retry');
    refreshSave();
  }, {enableHighAccuracy:true, maximumAge:5000, timeout:25000});
}
function stopGPS(){ if(watchId!=null){ try{navigator.geolocation.clearWatch(watchId);}catch(e){} watchId=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopGPS(); else if(!READONLY) startGPS(); });

/* ---------- form ---------- */
function chips(host, list, cur, cls, onPick){
  $(host).innerHTML = list.map(x=>'<button type="button" class="chip '+(cls?cls(x):'')+(x===cur?' on':'')+'" data-v="'+esc(x)+'">'+esc(x)+'</button>').join('');
  $(host).onclick = e=>{ const b=e.target.closest('.chip'); if(!b) return; onPick(b.dataset.v); chips(host,list,b.dataset.v,cls,onPick); };
}
function initChips(){
  chips('cType', TYPES, TYPE, null, v=>{TYPE=v;});
  chips('cInt', INTS, INTEREST, v=>v.toLowerCase(), v=>{INTEREST=v;});
}
function refreshSave(){
  const ok = !READONLY && !_saving && !!FIX && $('fShop').value.trim().length>0;
  const b=$('saveBtn'); b.disabled=!ok;
  b.textContent = !FIX ? 'Waiting for location' : (FIX.acc>200 ? 'Save anyway (weak location)' : 'Save visit');
}
['fShop'].forEach(id=>$(id).addEventListener('input',refreshSave));

/* photo: shrink to about 900 px JPEG before it is stored or sent */
function shrink(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const M=900, k=Math.min(1, M/Math.max(img.width,img.height));
      const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.72));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src=url;
  });
}
$('fPhoto').addEventListener('change', async e=>{
  const f=e.target.files && e.target.files[0]; if(!f) return;
  try{ PHOTO = await shrink(f); $('photoImg').src=PHOTO; $('photoPrev').style.display='block'; $('photoLbl').textContent='Retake photo'; }
  catch(err){ toast('Could not read that photo','err'); }
  e.target.value='';
});
$('photoX').addEventListener('click',()=>{ PHOTO=''; $('photoPrev').style.display='none'; $('photoLbl').textContent='Take photo'; });

function resetForm(){
  ['fShop','fOwner','fPhone','fProd','fAddr','fNext','fNotes'].forEach(id=>$(id).value='');
  PHOTO=''; $('photoPrev').style.display='none'; $('photoLbl').textContent='Take photo';
  INTEREST='Warm'; initChips(); refreshSave();
}

/* ---------- queue + sync (optimistic: UI never waits for the server) ---------- */
function loadQueue(){ QUEUE = lsGet(QKEY, []); }
function saveQueue(){
  if(!lsSet(QKEY, QUEUE)){
    // storage full: keep the visits, drop photos from the oldest items first
    for(const q of QUEUE){ if(q.photo){ q.photo=''; q.photoDropped=true; if(lsSet(QKEY,QUEUE)) return; } }
  }
}
function newId(){ return 'V'+Date.now()+'-'+Math.random().toString(36).slice(2,6); }

function onSave(){
  if(_saving || READONLY) return;
  const shop=$('fShop').value.trim();
  if(!shop){ toast('Enter the shop name','err'); return; }
  if(!FIX){ toast('Waiting for your location','err'); return; }
  _saving=true;
  const item={
    action:'addShopVisit', visitId:newId(), userId:USER_ID, name:USER_NAME, shop,
    owner:$('fOwner').value.trim(), phone:$('fPhone').value.trim(), addr:$('fAddr').value.trim(),
    lat:FIX.lat, lng:FIX.lng, acc:FIX.acc, type:TYPE, interest:INTEREST,
    products:$('fProd').value.trim(), next:$('fNext').value, notes:$('fNotes').value.trim(),
    photo:PHOTO, savedAt:new Date().toISOString(), status:'pending', err:''
  };
  QUEUE.push(item); saveQueue();
  resetForm(); _saving=false; refreshSave();
  toast('Saved. Sending in the background','ok');
  renderAll(); syncQueue();
}

async function postVisit(item){
  const body=Object.assign({}, item); delete body.status; delete body.err; delete body.savedAt; delete body.photoDropped;
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(), 45000);
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body),signal:ctl.signal});
    return await r.json();
  } finally { clearTimeout(to); }
}
async function syncQueue(){
  if(_syncing) return; _syncing=true;
  try{
    for(const item of QUEUE.slice()){
      if(item.status==='failed') continue;
      let r;
      try{ r=await postVisit(item); }catch(e){ break; }            // offline or slow: keep, retry later
      if(r && r.ok){
        QUEUE=QUEUE.filter(q=>q.visitId!==item.visitId); saveQueue();
        MINE.unshift({id:item.visitId,at:item.savedAt.slice(0,19),shop:item.shop,owner:item.owner,phone:item.phone,addr:item.addr,interest:item.interest,type:item.type,products:item.products,notes:item.notes,photo:r.photoId||''});
        if(r.photoError) toast('Visit saved, photo failed: '+r.photoError,'err');
        else if(r.similar && r.similar.length){ const s=r.similar[0]; toast('Saved. Similar shop already logged: '+s.shop+' ('+s.meters+' m)','ok'); }
      } else {
        item.status='failed'; item.err=(r&&r.error)||'Server refused'; saveQueue();
      }
    }
  } finally { _syncing=false; renderAll(); }
  if(QUEUE.some(q=>q.status!=='failed')) { clearTimeout(syncQueue._t); syncQueue._t=setTimeout(syncQueue,30000); }
  else loadMine(true);
}
window.addEventListener('online',syncQueue);

/* ---------- my visits ---------- */
function fmtDay(d){
  const t=new Date(); t.setHours(0,0,0,0); const x=new Date(d); x.setHours(0,0,0,0);
  const diff=Math.round((t-x)/86400000);
  if(diff===0) return 'Today'; if(diff===1) return 'Yesterday';
  return x.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function fmtTime(d){ return new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
function ymd(d){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }

async function loadMine(force){
  if(!MINE.length){ const c=lsGet(CKEY,null); if(c) MINE=c; renderAll(); }
  const from=new Date(); from.setDate(from.getDate()-6);
  const qs=new URLSearchParams({action:'getShopVisits',userId:USER_ID,mine:'1',from:ymd(from),to:ymd(new Date()),t:Date.now()});
  try{
    const r=await fetch(API+'?'+qs).then(x=>x.json());
    if(r && r.ok){ MINE=r.visits; lsSet(CKEY,MINE); renderAll(); }
  }catch(e){}
}
function renderQueueBanner(){
  const pend=QUEUE.filter(q=>q.status!=='failed').length, fail=QUEUE.filter(q=>q.status==='failed');
  const b=$('qBanner'); let h='';
  if(pend) h+='<div><b>'+pend+' visit'+(pend>1?'s':'')+' waiting to send.</b> They are safe on this phone and go out when the signal returns.</div>';
  fail.forEach(q=>{ h+='<div style="margin-top:6px"><b>'+esc(q.shop)+'</b> was refused: '+esc(q.err)+'</div>'; });
  if(h){ h+='<div class="q-row">'+(pend?'<button class="q-btn" id="qRetry" type="button">Send now</button>':'')+(fail.length?'<button class="q-btn alt" id="qDrop" type="button">Discard refused</button>':'')+'</div>'; }
  b.innerHTML=h; b.classList.toggle('show',!!h);
  const r=$('qRetry'); if(r) r.onclick=()=>{ QUEUE.forEach(q=>{}); syncQueue(); };
  const d=$('qDrop'); if(d) d.onclick=()=>{ QUEUE=QUEUE.filter(q=>q.status!=='failed'); saveQueue(); renderAll(); };
}
function matches(v, q){
  if(!q) return true;
  const hay=[v.shop,v.owner,v.phone,v.addr,v.notes,v.products,v.type,v.interest].join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w=>hay.indexOf(w)>=0);
}
function renderList(){
  const q=$('search').value.trim();
  const pending=QUEUE.map(x=>({id:x.visitId,at:x.savedAt,shop:x.shop,owner:x.owner,phone:x.phone,addr:x.addr,interest:x.interest,type:x.type,products:x.products,notes:x.notes,_wait:x.status==='failed'?'fail':'wait'}));
  const rows=pending.concat(MINE).filter(v=>matches(v,q));
  if(!rows.length){ $('list').innerHTML='<div class="empty">'+(q?'No visit matches that search':'No visits yet. Your first one will show here.')+'</div>'; return; }
  let h='', day='';
  rows.forEach(v=>{
    const d=fmtDay(v.at); if(d!==day){ day=d; h+='<div class="day">'+esc(d)+'</div>'; }
    h+='<div class="v"><div class="dot '+esc(v.interest)+'">'+esc((v.interest||'W').charAt(0))+'</div><div class="v-m"><div class="v-n">'+esc(v.shop)+'</div><div class="v-s">'+esc(fmtTime(v.at))+(v.owner?' · '+esc(v.owner):'')+(v.phone?' · '+esc(v.phone):'')+'</div></div>'
      +(v._wait==='wait'?'<span class="tag">Waiting</span>':v._wait==='fail'?'<span class="tag fail">Refused</span>':'')+'</div>';
  });
  $('list').innerHTML=h;
}
function renderAll(){ renderQueueBanner(); renderList(); const n=MINE.filter(v=>fmtDay(v.at)==='Today').length+QUEUE.length; $('hdrSub').textContent = n?('Today you have logged '+n+' shop'+(n>1?'s':'')+'. Keep the next one going.'):'Log the shop while you are standing in it. Location, details, photo, done.'; }
$('search').addEventListener('input',renderList);

/* ---------- pull to refresh ---------- */
async function forceRefresh(){
  const ind=$('ptrIndicator'); ind.classList.add('ptr-loading'); _ptrBusy=true; $('ptrText').textContent='Refreshing';
  try{ await syncQueue(); await loadMine(true); toast('Refreshed','ok'); }catch(e){ toast('Refresh failed','err'); }
  finally{ _ptrBusy=false; ind.classList.remove('ptr-loading'); $('ptrText').textContent='Pull to refresh'; }
}
function initPTR(){
  const ind=$('ptrIndicator'), txt=$('ptrText'); const MAX=90, FIRE=60; let startY=0, pulling=false, dist=0;
  document.addEventListener('touchstart',e=>{ if(_ptrBusy||window.scrollY>0){pulling=false;return;} startY=e.touches[0].clientY; pulling=true; },{passive:true});
  document.addEventListener('touchmove',e=>{ if(!pulling||_ptrBusy)return; dist=e.touches[0].clientY-startY; if(dist<=0){dist=0;ind.style.marginTop='-56px';return;} if(window.scrollY>0){pulling=false;return;} const es=Math.min(MAX,dist*0.5); ind.style.marginTop=(es-56)+'px'; txt.textContent=es>=FIRE?'Release to refresh':'Pull to refresh'; },{passive:true});
  document.addEventListener('touchend',()=>{ if(!pulling)return; pulling=false; const es=Math.min(MAX,dist*0.5); if(es>=FIRE){ind.style.marginTop='0px';forceRefresh().then(()=>{ind.style.marginTop='-56px';});} else ind.style.marginTop='-56px'; dist=0; });
}

/* no popups in this panel, but the shell may still ask */
window.__erpHandleBack = function(){ return false; };

window.addEventListener('DOMContentLoaded',()=>{
  initChips(); initPTR(); loadQueue();
  $('gpsBtn').onclick=startGPS; $('saveBtn').onclick=onSave;
  const t=new Date(); $('fNext').min=ymd(t);
  if(READONLY){ $('roMsg').style.display='block'; $('saveBtn').disabled=true; setGps('bad','View only','This account cannot save visits'); }
  else startGPS();
  renderAll(); loadMine(); if(QUEUE.length) syncQueue();
});
</script>
