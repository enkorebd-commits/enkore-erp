<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cash & Submit — Enkore</title>
<style>
:root{
  --blue:#1971c2;--blue2:#4098e6;--bluebg:#e7f1fb;
  --grn:#1b6b3a;--grn2:#2d8a52;--grnbg:#edf7f1;--red:#e03131;--redbg:#fff5f5;
  --amber:#e67e22;--amberbg:#fff4e6;
  --text:#1a1a2e;--muted:#868e96;--border:#dee2e6;--bg:#f3f4f6;--card:#fff;
  --r:14px;--sh:0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;overscroll-behavior:none}

.hdr{background:linear-gradient(135deg,#123a63,#1971c2);color:#fff;padding:18px 16px 16px;box-shadow:0 2px 12px rgba(0,0,0,.2)}
.hdr-t{font-size:19px;font-weight:900;letter-spacing:.2px}
.hdr-s{font-size:12px;opacity:.88;font-weight:600;margin-top:3px}

.body{padding:14px;max-width:560px;margin:0 auto;padding-bottom:44px}
.sec-t{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:18px 4px 8px}
.sec-t:first-child{margin-top:2px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:10px}

/* the one number that matters */
.hand{border-radius:var(--r);padding:18px 16px;color:#fff;text-align:center;margin-bottom:10px}
.hand.ok{background:linear-gradient(135deg,#1b6b3a,#2d8a52);box-shadow:0 6px 18px rgba(27,107,58,.3)}
.hand.hot{background:linear-gradient(135deg,#b3341f,#e03131);box-shadow:0 6px 18px rgba(224,49,49,.32)}
.hand.zero{background:linear-gradient(135deg,#4a5560,#6b7684)}
.hand-l{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1.2px;opacity:.9}
.hand-v{font-size:38px;font-weight:900;letter-spacing:-1px;line-height:1.05;margin-top:5px}
.hand-v .u{font-size:14px;font-weight:800;opacity:.85;margin-left:4px}
.hand-s{font-size:12.5px;font-weight:600;opacity:.94;margin-top:8px;line-height:1.5}

/* ledger maths, shown openly so nobody argues about the number */
.led{display:flex;flex-direction:column;gap:0}
.led-row{display:flex;justify-content:space-between;align-items:center;padding:10px 2px;border-bottom:1px solid #f1f3f5;font-size:13px}
.led-row:last-child{border-bottom:none}
.led-k{font-weight:700;color:var(--muted)}
.led-k small{display:block;font-size:10.5px;font-weight:600;color:#adb5bd;margin-top:2px}
.led-v{font-weight:900;white-space:nowrap}
.led-row.tot{border-top:2px solid var(--border);margin-top:4px;padding-top:12px}
.led-row.tot .led-k{color:var(--text)}
.led-row.tot .led-v{font-size:17px}
.grn{color:var(--grn)}.red{color:var(--red)}.blue{color:var(--blue)}.amb{color:var(--amber)}

/* form */
.field{margin-bottom:10px}
.field label{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.inp{width:100%;padding:13px 14px;font-size:16px;border:1.5px solid var(--border);border-radius:11px;outline:none;background:#fff;color:var(--text);font-family:inherit}
.inp:focus{border-color:var(--blue)}
.quick{display:flex;gap:7px;margin:-2px 0 12px;flex-wrap:wrap}
.qbtn{flex:1;min-width:72px;padding:9px 6px;font-size:12px;font-weight:800;color:var(--blue);background:var(--bluebg);border:1.5px solid #cfe3f7;border-radius:9px;cursor:pointer;font-family:inherit}
.qbtn:active{transform:scale(.97)}
.btn{width:100%;padding:14px;font-size:15px;font-weight:800;color:#fff;background:var(--blue);border:none;border-radius:11px;cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.99)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.note{font-size:12px;font-weight:600;background:var(--bluebg);color:#0f4f8a;padding:10px 12px;border-radius:10px;line-height:1.5;margin-top:10px}
.note.warn{background:var(--amberbg);color:#9a6414}

/* history */
.hitem{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f1f3f5}
.hitem:last-child{border-bottom:none}
.hitem .hd{flex:1;min-width:0}
.hitem .ha{font-size:15px;font-weight:900}
.hitem .hdate{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.hitem .hcm{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.badge{flex-shrink:0;font-size:10px;font-weight:800;padding:4px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
.badge.Pending{background:var(--amberbg);color:#b06a12}
.badge.Approved{background:var(--grnbg);color:var(--grn)}
.badge.Rejected{background:var(--redbg);color:var(--red)}
.sumline{display:flex;gap:8px;margin-bottom:10px}
.sumline .sb{flex:1;text-align:center;background:var(--bg);border-radius:11px;padding:10px 4px}
.sb-l{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.sb-v{font-size:15px;font-weight:900;margin-top:3px}

.state{text-align:center;padding:48px 20px;color:var(--muted)}
.state-icon{font-size:34px;margin-bottom:8px}
.state-txt{font-size:13px;font-weight:600}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:12.5px;font-weight:600}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid #d0d4dc;border-top-color:var(--blue);border-radius:50%;animation:rot .6s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}

#ptrIndicator{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;margin-top:-56px;font-size:12px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.96);border:1px solid #e3e7ee;border-radius:999px;box-shadow:0 4px 16px rgba(0,0,0,.14);z-index:250;transition:margin-top .18s ease;pointer-events:none;white-space:nowrap}
#ptrIndicator .ptr-spin{width:16px;height:16px;border:2.5px solid #d0d4dc;border-top-color:var(--blue);border-radius:50%;display:inline-block}
#ptrIndicator.ptr-loading .ptr-spin{animation:rot .6s linear infinite}

/* confirm sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:500;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px 24px;animation:up .22s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh-t{font-size:17px;font-weight:900;text-align:center}
.sh-amt{font-size:34px;font-weight:900;text-align:center;color:var(--blue);margin:8px 0 4px;letter-spacing:-.5px}
.sh-s{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5;font-weight:600;margin-bottom:14px}
.sh-btns{display:flex;gap:9px}
.sh-btns .btn{flex:1}
.btn.ghost{background:var(--bg);color:var(--text)}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:#1a1a2e;color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:600;opacity:0;transition:.25s;max-width:90%;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{background:#c0392b}
.hide{display:none!important}
</style>
</head>
<body>

<div id="ptrIndicator"><span class="ptr-spin"></span><span id="ptrText">Pull to refresh</span></div>

<div class="hdr">
  <div class="hdr-t">Cash & Submit Money</div>
  <div class="hdr-s" id="hSub">—</div>
</div>

<div class="body" id="body">
  <div class="state"><div class="state-txt"><span class="spin"></span> Loading cash position…</div></div>
</div>

<div class="ov" id="cfmOv">
  <div class="sheet">
    <div class="sh-t">Confirm submission</div>
    <div class="sh-amt" id="cfmAmt">0 tk</div>
    <div class="sh-s" id="cfmSub">This goes to your approver. Once approved it leaves your cash in hand.</div>
    <div class="sh-btns">
      <button class="btn ghost" onclick="closeCfm()">Cancel</button>
      <button class="btn" id="cfmGo" onclick="doSubmit()">Yes, submit</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* Cash panel — reads the same Salesman API as the profile panel. Kept separate
   from profile-s.html so money handling is a deliberate destination, not a
   footer on a page the salesman scrolls past. */
const API   = 'https://script.google.com/macros/s/AKfycbylAEyTwyBrejsLKA1a5-dhL57K44UVUJOT9rDvLtd53GSzR-WEEAMYD-WYVx7SpGUaJA/exec';
const PARAMS   = new URLSearchParams(location.search);
const USER_ID  = PARAMS.get('userId') || '';
const READONLY = PARAMS.get('readonly') === '1';
const CACHE_KEY = 'enkore_cashS_' + USER_ID;
const LAST_REFRESH_KEY = 'enkore_cashS_last_refresh_' + USER_ID;
let DATA=null, _ptrBusy=false, _submitting=false, _pendingAmt=0, _pendingCmt='';

/* Same refresh policy as the other panels: cached view paints instantly, network
   call only on first load, first open after 6 AM, manual pull, or own action. */
function refreshDue(){
  const last=parseInt(localStorage.getItem(LAST_REFRESH_KEY)||'0',10);
  const b=new Date(); b.setHours(6,0,0,0);
  if(Date.now()<b.getTime()) b.setDate(b.getDate()-1);
  return last<b.getTime();
}
function markRefreshed(){ try{ localStorage.setItem(LAST_REFRESH_KEY,String(Date.now())); }catch(_){} }
function readCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(_){ return null; } }
function writeCache(d){ try{ localStorage.setItem(CACHE_KEY,JSON.stringify(d)); }catch(_){} }

function tk(n){ if(n===''||n==null||isNaN(n)) return '0 <span class="u">tk</span>'; return Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})+' <span class="u">tk</span>'; }
function tkPlain(n){ if(n===''||n==null||isNaN(n)) return '0 tk'; return Number(n).toLocaleString('en-IN',{maximumFractionDigits:2})+' tk'; }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(m,t){ const e=document.getElementById('toast'); e.innerHTML=m; e.className='show'+(t==='err'?' err':''); clearTimeout(window._tt); window._tt=setTimeout(()=>e.className='',2600); }
const MOS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(v){ if(!v) return ''; const d=new Date(v); if(isNaN(d)) return String(v); return d.getDate()+' '+MOS[d.getMonth()]+', '+d.getFullYear(); }

async function load(force){
  const cached=readCache();
  if(cached){ DATA=cached; paint(); }
  if(!USER_ID){ document.getElementById('body').innerHTML='<div class="state"><div class="state-icon">🔒</div><div class="state-txt">No user id. Open this from the ERP.</div></div>'; return; }
  if(!force && DATA && !refreshDue()) return;
  try{
    const r=await fetch(`${API}?action=getProfile&userId=${encodeURIComponent(USER_ID)}&t=${Date.now()}`).then(x=>x.json());
    if(!r.ok) throw new Error(r.error||'load failed');
    DATA=r; writeCache(r); markRefreshed(); paint();
  }catch(e){
    console.error(e);
    if(!DATA) document.getElementById('body').innerHTML='<div class="state"><div class="state-icon">⚠️</div><div class="state-txt">Could not load. Pull down to retry.</div></div>';
    else toast('Refresh failed','err');
  }
}

function paint(){
  const d=DATA;
  const received=Number(d.cashReceived)||0;
  const inHand=Number(d.cashInHand)||0;
  const hist=(d.submitHistory||[]).slice();
  const approved=hist.filter(s=>(s.status||'')==='Approved').reduce((t,s)=>t+(Number(s.amount)||0),0);
  const pending =hist.filter(s=>(s.status||'Pending')==='Pending').reduce((t,s)=>t+(Number(s.amount)||0),0);
  const rejected=hist.filter(s=>(s.status||'')==='Rejected').length;

  document.getElementById('hSub').textContent=(d.name||d.id)+' · company cash you are holding';

  let h='';

  // 1) THE NUMBER — cash in hand, framed as a responsibility, not a balance
  const cls = inHand<=0 ? 'zero' : (inHand>=5000 ? 'hot' : 'ok');
  h+='<div class="hand '+cls+'">'
    +'<div class="hand-l">Cash In Your Hand Right Now</div>'
    +'<div class="hand-v">'+tk(inHand)+'</div>'
    +'<div class="hand-s">'+(
      inHand<=0 ? 'All clear. Nothing of the company is sitting with you.'
      : (inHand>=5000 ? 'This is company money, not yours. Submit it today and keep your record clean.'
                      : 'Submit it when you next reach the office. Do not let it pile up.')
    )+'</div></div>';

  // 2) HOW THE NUMBER IS BUILT — shown openly so it is never disputed
  h+='<div class="sec-t">How this is calculated</div>';
  h+='<div class="card"><div class="led">'
    +'<div class="led-row"><span class="led-k">Cash you collected<small>All payments received under your ID</small></span><span class="led-v grn">'+tkPlain(received)+'</span></div>'
    +'<div class="led-row"><span class="led-k">Approved submissions<small>Already handed over and signed off</small></span><span class="led-v blue">− '+tkPlain(approved)+'</span></div>'
    +'<div class="led-row tot"><span class="led-k">Cash in hand</span><span class="led-v '+(inHand<0?'red':'grn')+'">'+tkPlain(inHand)+'</span></div>'
    +'</div>';
  if(pending>0) h+='<div class="note warn">⏳ '+tkPlain(pending)+' is submitted but still waiting for approval. It stays in your hand figure until your approver signs it off.</div>';
  if(inHand<0) h+='<div class="note warn">⚠️ Negative figure means more was approved than recorded as collected under your ID. Report this to Operations.</div>';
  h+='</div>';

  // 3) SUBMIT
  if(!READONLY){
    h+='<div class="sec-t">Submit money</div>';
    h+='<div class="card">';
    h+='<div class="field"><label>Amount to submit (tk)</label><input class="inp" id="amt" type="number" inputmode="decimal" min="1" placeholder="e.g. 5000"></div>';
    if(inHand>0){
      h+='<div class="quick">'
        +'<button class="qbtn" onclick="setAmt('+(Math.round(inHand))+')">All '+tkPlain(Math.round(inHand))+'</button>'
        +'<button class="qbtn" onclick="setAmt('+(Math.round(inHand/2))+')">Half</button>'
        +'<button class="qbtn" onclick="setAmt(1000)">1,000</button>'
        +'</div>';
    }
    h+='<div class="field"><label>Comment (optional)</label><input class="inp" id="cmt" type="text" placeholder="e.g. cash handed to office"></div>';
    h+='<button class="btn" id="subBtn" onclick="askSubmit()">Submit for approval</button>';
    h+='<div class="note">Your approver sees this immediately. It only leaves your cash in hand once they approve it.</div>';
    h+='</div>';
  }

  // 4) HISTORY
  h+='<div class="sec-t">Submission history</div>';
  h+='<div class="card">';
  h+='<div class="sumline">'
    +'<div class="sb"><div class="sb-l">Approved</div><div class="sb-v grn">'+tkPlain(approved)+'</div></div>'
    +'<div class="sb"><div class="sb-l">Pending</div><div class="sb-v amb">'+tkPlain(pending)+'</div></div>'
    +'<div class="sb"><div class="sb-l">Rejected</div><div class="sb-v '+(rejected?'red':'')+'">'+rejected+'</div></div>'
    +'</div>';
  if(hist.length){
    h+=hist.reverse().map(s=>{
      const st=(s.status||'Pending');
      return '<div class="hitem"><div class="hd"><div class="ha">'+tkPlain(s.amount)+'</div>'
        +'<div class="hdate">'+(fmtDate(s.date)||'—')+'</div></div>'
        +'<span class="badge '+escapeHtml(st)+'">'+escapeHtml(st)+'</span></div>';
    }).join('');
  } else {
    h+='<div class="empty">No submissions yet.</div>';
  }
  h+='</div>';

  document.getElementById('body').innerHTML=h;
}

function setAmt(v){ const el=document.getElementById('amt'); if(el){ el.value=v; el.focus(); } }

/* Confirm before writing. Cash is the one action here that a mis-tap makes
   awkward to undo, so it gets a deliberate second step. */
function askSubmit(){
  const amt=parseFloat((document.getElementById('amt').value||'').replace(/[^0-9.]/g,''));
  const cmt=(document.getElementById('cmt').value||'').trim();
  if(!amt||amt<=0){ toast('Enter a valid amount','err'); return; }
  const inHand=Number(DATA&&DATA.cashInHand)||0;
  _pendingAmt=amt; _pendingCmt=cmt;
  document.getElementById('cfmAmt').textContent=tkPlain(amt);
  document.getElementById('cfmSub').innerHTML = amt>inHand
    ? '⚠️ This is more than your recorded cash in hand ('+tkPlain(inHand)+'). Submit only if you are sure.'
    : 'This goes to your approver. It leaves your cash in hand once approved.';
  openCfm();
}
function openCfm(){
  const ov=document.getElementById('cfmOv');
  if(ov.classList.contains('open')) return;
  ov.classList.add('open');
  try{ if(parent&&parent.__erpOv) parent.__erpOv(); }catch(_){}
}
function closeCfm(){
  const ov=document.getElementById('cfmOv');
  if(!ov.classList.contains('open')) return;
  ov.classList.remove('open');
  try{ if(parent&&parent.__erpOvClose) parent.__erpOvClose(); }catch(_){}
}

async function doSubmit(){
  if(_submitting) return;
  _submitting=true;
  const go=document.getElementById('cfmGo'); go.disabled=true; go.textContent='Submitting…';
  try{
    const qs=new URLSearchParams({action:'submitCash',userId:USER_ID,amount:_pendingAmt,comment:_pendingCmt});
    const r=await fetch(`${API}?${qs}`).then(x=>x.json());
    if(!r.ok) throw new Error(r.error||'failed');
    closeCfm();
    toast('✅ Submitted '+tkPlain(_pendingAmt)+' — pending approval');
    await load(true);   // own action changed the data — always pull fresh
  }catch(e){
    console.error(e); toast('Submit failed. Try again.','err');
  }finally{
    _submitting=false; go.disabled=false; go.textContent='Yes, submit';
  }
}

async function forceRefresh(){
  if(_ptrBusy) return; _ptrBusy=true;
  const ind=document.getElementById('ptrIndicator'); ind.classList.add('ptr-loading');
  document.getElementById('ptrText').textContent='Refreshing…';
  try{ await load(true); toast('✅ Refreshed'); }catch(e){ toast('Refresh failed','err'); }
  finally{ _ptrBusy=false; ind.classList.remove('ptr-loading'); document.getElementById('ptrText').textContent='Pull to refresh'; }
}
function initPTR(){
  const ind=document.getElementById('ptrIndicator'), txt=document.getElementById('ptrText');
  const MAX=90, FIRE=60; let startY=0, pulling=false, dist=0;
  const sheetOpen=()=>document.getElementById('cfmOv').classList.contains('open');
  document.addEventListener('touchstart',e=>{ if(_ptrBusy||sheetOpen()||window.scrollY>0){pulling=false;return;} startY=e.touches[0].clientY; pulling=true; },{passive:true});
  document.addEventListener('touchmove',e=>{ if(!pulling||_ptrBusy)return; dist=e.touches[0].clientY-startY; if(dist<=0){dist=0;ind.style.marginTop='-56px';return;} if(window.scrollY>0){pulling=false;return;} const es=Math.min(MAX,dist*0.5); ind.style.marginTop=(es-56)+'px'; txt.textContent=es>=FIRE?'Release to refresh':'Pull to refresh'; },{passive:true});
  document.addEventListener('touchend',()=>{ if(!pulling)return; pulling=false; const es=Math.min(MAX,dist*0.5); if(es>=FIRE){ind.style.marginTop='0px';forceRefresh().then(()=>{ind.style.marginTop='-56px';});} else ind.style.marginTop='-56px'; dist=0; });
}

window.addEventListener('DOMContentLoaded',()=>{
  load(); initPTR();
  document.getElementById('cfmOv').addEventListener('click',e=>{ if(e.target.id==='cfmOv') closeCfm(); });
});

// ── SHELL BACK-BUTTON HOOK ──
// Back closes the confirm sheet first instead of leaving the panel.
window.__erpHandleBack = function(){
  const ov=document.getElementById('cfmOv');
  if(ov && ov.classList.contains('open')){ closeCfm(); return true; }
  return false;
};
</script>
</body>
</html>
