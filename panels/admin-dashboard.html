<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    :root {
      --blue:    #29ABE2;
      --blue-d:  #1583b3;
      --green:   #16b07c;
      --red:     #ef4444;
      --bg:      #f4f6fa;
      --card:    #ffffff;
      --text:    #16181d;
      --sub2:    #828791;
      --border:  #eceff3;
      --r:       16px;
      --sh:      0 1px 3px rgba(18,22,33,.06), 0 0 1px rgba(18,22,33,.08);
    }
    html { background:#f4f6fa; }
    body {
      font-family:'Inter',sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-y:auto;
      min-height:100vh;
      padding-bottom:28px;
      /* Cloak until the cached data is painted, so opening the panel shows the
         content in one step instead of flashing the loading placeholders. */
      visibility:hidden;
    }
    body.booted { visibility:visible; }

    /* ── greeting ── */
    /* brand navy — deep shades of the Enkore blue (#29ABE2) */
    .greeting {
      background:linear-gradient(140deg,#0a1f30 0%,#0f3552 70%,#13507c 100%);
      padding:18px 18px 22px;
      color:#fff; position:relative; overflow:hidden;
    }
    .greeting::after {
      content:''; position:absolute; right:-40px; top:-50px;
      width:180px; height:180px; border-radius:50%;
      background:rgba(255,255,255,.05);
    }
    .g-date  { font-size:11px; color:rgba(255,255,255,.55); margin-bottom:4px; font-weight:600; letter-spacing:.3px; }
    .g-name  { font-size:20px; font-weight:800; line-height:1.2; letter-spacing:-.3px; }
    .g-quote { font-size:11px; color:rgba(255,255,255,.45); font-style:italic; margin-top:6px; line-height:1.5; max-width:300px; }

    /* ══ INSIGHTS LAYER (hero · attention · trend) ══ */
    .hero { background:linear-gradient(150deg,#0a1f30 0%,#123a58 58%,#155b8a 100%);
      border-radius:var(--r); padding:16px; color:#fff; margin-bottom:12px;
      box-shadow:0 6px 22px rgba(10,31,48,.3); border:1px solid rgba(41,171,226,.3); }
    .hero-row { display:flex; align-items:center; gap:15px; }
    .ringwrap { position:relative; width:114px; height:114px; flex-shrink:0; }
    .ringsvg { width:114px; height:114px; transform:rotate(-90deg); }
    .ring-bg { fill:none; stroke:rgba(255,255,255,.14); stroke-width:11; }
    .ring-fg { fill:none; stroke-width:11; stroke-linecap:round;
      transition:stroke-dashoffset .8s cubic-bezier(.25,.46,.45,.94); }
    .ringtxt { position:absolute; inset:0; display:flex; flex-direction:column;
      align-items:center; justify-content:center; }
    .ringv { font-size:25px; font-weight:800; letter-spacing:-1px; line-height:1; }
    .ringv span { font-size:12px; margin-left:1px; }
    .ringl { font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
      color:rgba(255,255,255,.6); margin-top:3px; text-align:center; }
    .hero-side { flex:1; min-width:0; }
    .hs-k { font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.6px;
      color:rgba(255,255,255,.58); margin-top:9px; }
    .hs-k:first-child { margin-top:0; }
    .hs-v { font-size:21px; font-weight:800; letter-spacing:-.6px; line-height:1.15; }
    .hs-v2 { font-size:14px; font-weight:800; line-height:1.2; }
    .hs-v2.up { color:#5fe0ad; } .hs-v2.dn { color:#ff9c9c; }
    .hero-note { margin-top:13px; font-size:11.5px; font-weight:600; line-height:1.5;
      background:rgba(255,255,255,.1); padding:10px 12px; border-radius:10px; }
    .hero-note.bad { background:rgba(239,68,68,.24); }
    .hero-foot { display:flex; gap:8px; margin-top:11px; }
    .hero-foot .hf { flex:1; background:rgba(255,255,255,.09); border-radius:10px; padding:9px 6px; text-align:center; }
    .hf-l { font-size:8px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; color:rgba(255,255,255,.55); }
    .hf-v { font-size:13px; font-weight:800; margin-top:2px; }

    .acts { display:flex; flex-direction:column; gap:8px; }
    .act { display:flex; gap:11px; background:var(--card); border-radius:12px; box-shadow:var(--sh);
      padding:12px 13px; border-left:4px solid var(--blue); }
    .act.warn { border-left-color:#f59e0b; } .act.bad { border-left-color:var(--red); }
    .act-n { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:#e8f6fd; color:var(--blue-d);
      font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
    .act.warn .act-n { background:#fff4e2; color:#b7791f; }
    .act.bad  .act-n { background:#fee6e6; color:#c53030; }
    .act-t { flex:1; min-width:0; }
    .act-t b { display:block; font-size:13px; font-weight:800; line-height:1.35; }
    .act-t span { display:block; font-size:11.5px; color:var(--sub2); font-weight:500; line-height:1.5; margin-top:3px; }
    .all-clear { background:var(--card); border-radius:12px; box-shadow:var(--sh); padding:16px;
      text-align:center; font-size:12.5px; font-weight:600; color:#16b07c; }

    .chartcard { background:var(--card); border-radius:var(--r); box-shadow:var(--sh); padding:14px 12px 12px; }
    .chart-hd { display:flex; align-items:baseline; justify-content:space-between; padding:0 2px 10px; }
    .chart-t { font-size:12px; font-weight:800; }
    .chart-s { font-size:10.5px; font-weight:700; color:var(--sub2); }
    .chart-svg { width:100%; height:auto; display:block; overflow:visible; }
    .chart-svg .hit { fill:transparent; cursor:pointer; }
    .chart-legend { display:flex; gap:14px; justify-content:center; margin-top:9px;
      font-size:10.5px; font-weight:700; color:var(--sub2); }
    .chart-legend i { display:inline-block; width:9px; height:3px; border-radius:2px; margin-right:5px; vertical-align:2px; }
    .chart-legend .l1 i { background:var(--blue); } .chart-legend .l2 i { background:var(--green); }
    .chart-hint { text-align:center; font-size:10.5px; font-weight:600; color:var(--sub2); margin-top:8px; }
    .chart-detail { margin-top:10px; background:#eef7fd; border:1px solid #d3e9f7; border-radius:11px; padding:11px 12px; }
    .cd-hd { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
    .cd-m { font-size:13px; font-weight:800; color:#0f5680; }
    .cd-x { font-size:9.5px; font-weight:700; color:#6c9cbc; letter-spacing:.4px; }
    .cd-row { display:flex; gap:7px; }
    .cd-b { flex:1; text-align:center; background:#fff; border-radius:9px; padding:8px 3px; }
    .cd-l { font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--sub2); }
    .cd-v { font-size:12.5px; font-weight:800; margin-top:2px; }
    .cd-note { font-size:11px; font-weight:600; color:#0f5680; margin-top:8px; text-align:center; line-height:1.45; }

    .section { padding:14px 14px 0; }
    .sec-hdr { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .sec-title { font-size:10px; font-weight:800; letter-spacing:1.2px; color:var(--sub2); text-transform:uppercase; }

    /* ── amounts with tk unit ── */
    .amt { display:inline-flex; align-items:flex-end; gap:2px; }
    .amt .tk { font-size:.55em; font-weight:700; color:var(--sub2); padding-bottom:1px; }

    /* ── compact YTD stats ── */
    .ytd-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    @media(min-width:560px){ .ytd-grid { grid-template-columns:repeat(7,1fr); } }
    .ystat {
      background:var(--card); border-radius:12px; padding:9px 8px 8px;
      box-shadow:var(--sh); text-align:left;
    }
    .ystat-l { font-size:8.5px; color:var(--sub2); font-weight:700; text-transform:uppercase; letter-spacing:.3px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .ystat-v { font-size:13px; font-weight:800; line-height:1; white-space:nowrap; }
    .ystat-v.pos { color:var(--green); }
    .ystat-v.neg { color:var(--red); }
    .ystat-v.blu { color:var(--blue); }

    /* ── cash ── */
    .cash-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
    .ccard {
      background:var(--card); border-radius:12px; padding:10px 12px;
      box-shadow:var(--sh); display:flex; align-items:center; gap:10px;
    }
    .c-ava {
      width:30px; height:30px; border-radius:50%; flex-shrink:0;
      background:linear-gradient(135deg,#29ABE2,#1d6fa3); color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:11px; font-weight:800;
    }
    .ccard-name { font-size:10px; color:var(--sub2); font-weight:600; line-height:1.2; }
    .ccard-val  { font-size:15px; font-weight:800; color:var(--text); margin-top:1px; }

    /* ═══ SALES VS COLLECTION — distinct dark card ═══ */
    .sc-wrap {
      background:linear-gradient(140deg,#0a1f30 0%,#0f3552 70%,#13507c 100%);
      border-radius:18px; padding:14px 12px 12px;
      box-shadow:0 6px 20px rgba(10,31,48,.3);
      color:#fff;
    }
    .sc-title { font-size:10px; font-weight:800; letter-spacing:1.2px; color:rgba(255,255,255,.55); text-transform:uppercase; margin-bottom:10px; }
    .sc-wrap .amt .tk { color:rgba(255,255,255,.45); }

    .range-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .dwrap {
      position:relative; flex:1; min-width:0;
      background:linear-gradient(135deg,rgba(22,176,124,.85),rgba(16,140,98,.85));
      border:1px solid rgba(63,224,168,.45);
      border-radius:12px; padding:10px 6px;
      font-size:13px; font-weight:700; color:#fff; text-align:center;
      white-space:nowrap; overflow:hidden;
      box-shadow:0 2px 8px rgba(22,176,124,.25);
    }
    .dwrap:active { filter:brightness(1.08); }
    .dwrap input {
      position:absolute; inset:0; width:100%; height:100%;
      opacity:0; border:0; cursor:pointer; -webkit-appearance:none;
    }
    .dwrap input::-webkit-calendar-picker-indicator {
      position:absolute; inset:0; width:100%; height:100%;
      cursor:pointer; opacity:0;
    }
    .range-arrow { font-size:12px; color:rgba(255,255,255,.5); flex-shrink:0; font-weight:700; }

    .sc-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:10px; }
    .gtile {
      background:rgba(255,255,255,.17); border:1px solid rgba(255,255,255,.24);
      border-radius:12px; padding:9px 10px;
      box-shadow:0 4px 12px rgba(5,18,29,.35);
    }
    .gtile-l { font-size:9px; color:rgba(255,255,255,.7); font-weight:700; text-transform:uppercase; letter-spacing:.4px; margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .gtile-v { font-size:14px; font-weight:800; line-height:1; white-space:nowrap; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.25); }
    .gtile-v.pos { color:#4ef0b6; }
    .gtile-v.neg { color:#ff9494; }
    .sc-wrap .amt .tk { color:rgba(255,255,255,.6); }

    .chart-panel {
      background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.07);
      border-radius:14px; padding:10px 8px 6px;
      position:relative; height:225px;
    }
    .chart-panel .state { padding:70px 20px; color:rgba(255,255,255,.55); }
    .chart-panel .spin { border-color:rgba(255,255,255,.2); border-top-color:#fff; }

    /* ── table ── */
    .tbl-card {
      background:var(--card); border-radius:var(--r);
      box-shadow:var(--sh); margin-bottom:16px; overflow:hidden;
    }
    .tbl-scroll { overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .perf-tbl { width:100%; min-width:520px; border-collapse:collapse; font-size:12px; }
    .perf-tbl th {
      text-align:right; padding:11px 10px; font-size:9px; font-weight:800;
      text-transform:uppercase; letter-spacing:.6px; color:rgba(255,255,255,.85);
      white-space:nowrap; background:#0f3552; border-bottom:none;
    }
    .perf-tbl th:first-child, .perf-tbl td:first-child { text-align:left; padding-left:14px; }
    .perf-tbl td {
      padding:11px 10px; text-align:right; font-weight:600;
      border-bottom:1px solid #f3f5f8; white-space:nowrap;
    }
    .perf-tbl tr:last-child td { border-bottom:none; }
    .seller-cell { display:flex; align-items:center; gap:8px; }
    .s-ava {
      width:26px; height:26px; border-radius:50%; flex-shrink:0;
      background:#e7f5fd; color:var(--blue-d);
      display:flex; align-items:center; justify-content:center;
      font-size:10px; font-weight:800;
    }
    .s-name { font-weight:700; max-width:110px; overflow:hidden; text-overflow:ellipsis; }
    .perf-tbl .tot td { background:#e7f5fd; border-top:2px solid var(--blue); font-weight:800; }
    .rate-pill { display:inline-block; padding:3px 8px; border-radius:20px; font-size:11px; font-weight:800; }
    .rate-hi  { background:#e4f8f0; color:var(--green); }
    .rate-mid { background:#e7f5fd; color:var(--blue-d); }
    .rate-lo  { background:#feecec; color:var(--red); }
    .pos-t { color:var(--green); }
    .neg-t { color:var(--red); }

    .state { text-align:center; padding:30px 20px; color:var(--sub2); font-size:13px; }
    .spin { width:22px; height:22px; border:2px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
    @keyframes spin { to { transform:rotate(360deg); } }
    /* pull-to-refresh indicator */
    #ptrIndicator { position:fixed; top:8px; left:50%; transform:translateX(-50%); display:flex; align-items:center; justify-content:center; gap:8px;
      height:40px; padding:0 18px; margin-top:-60px; font-size:12px; font-weight:600; color:var(--sub2);
      background:rgba(255,255,255,.96); border:1px solid #e3e7ee; border-radius:999px; box-shadow:0 4px 16px rgba(0,0,0,.14);
      white-space:nowrap; z-index:60; transition:margin-top .18s ease; pointer-events:none; }
    #ptrIndicator .ptr-spin { width:15px; height:15px; border:2px solid var(--border); border-top-color:var(--blue); border-radius:50%; display:inline-block; }
    #ptrIndicator.ptr-loading .ptr-spin { animation:spin .7s linear infinite; }
  </style>
</head>
<body>

<div id="ptrIndicator"><span class="ptr-spin"></span><span id="ptrText">Pull to refresh</span></div>

<div class="greeting">
  <div class="g-date"  id="g-date"></div>
  <div class="g-name"  id="g-name">Loading...</div>
  <div class="g-quote" id="g-quote"></div>
</div>

<!-- YTD + CASH (live) -->
<div id="dash-body">
  <div class="state"><div class="spin"></div>Loading dashboard...</div>
</div>

<!-- SALES VS COLLECTION -->
<div class="section">
  <div class="sc-wrap">
    <div class="sc-title">Sales vs Collection</div>
    <div class="range-row">
      <div class="dwrap" onclick="openPicker('d-start')"><span id="ds-show">—</span><input type="date" id="d-start" onchange="renderAnalytics()"></div>
      <span class="range-arrow">→</span>
      <div class="dwrap" onclick="openPicker('d-end')"><span id="de-show">—</span><input type="date" id="d-end" onchange="renderAnalytics()"></div>
    </div>
    <div class="sc-grid" id="sc-grid" style="display:none">
      <div class="gtile"><div class="gtile-l">Sales</div><div class="gtile-v" id="k-sales">—</div></div>
      <div class="gtile"><div class="gtile-l">Due</div><div class="gtile-v" id="k-due">—</div></div>
      <div class="gtile"><div class="gtile-l">Collection</div><div class="gtile-v" id="k-coll">—</div></div>
      <div class="gtile"><div class="gtile-l">Collection Rate</div><div class="gtile-v" id="k-crate">—</div></div>
      <div class="gtile"><div class="gtile-l">Gross Profit</div><div class="gtile-v" id="k-gp">—</div></div>
      <div class="gtile"><div class="gtile-l">Gross Profit %</div><div class="gtile-v" id="k-gpp">—</div></div>
      <div class="gtile"><div class="gtile-l">Expense</div><div class="gtile-v" id="k-exp">—</div></div>
      <div class="gtile"><div class="gtile-l">Net Profit</div><div class="gtile-v" id="k-np">—</div></div>
      <div class="gtile"><div class="gtile-l">Net Profit %</div><div class="gtile-v" id="k-npp">—</div></div>
    </div>
    <div class="chart-panel">
      <div class="state" id="an-state"><div class="spin"></div>Loading sales data...</div>
      <canvas id="trendChart" style="display:none"></canvas>
    </div>
  </div>
</div>

<div class="section" id="perf-section" style="display:none; padding-top:14px;">
  <div class="sec-hdr"><span class="sec-title">Salesman Performance</span></div>
  <div class="tbl-card"><div class="tbl-scroll">
    <table class="perf-tbl" id="perf-tbl"></table>
  </div></div>
</div>

<script>
  const FIN_SHEET_ID = '1XE05NQJYc2QPM1qUivoGYUynu-lI1iaTH5Y785dPwJk';

  const qp    = new URLSearchParams(window.location.search);
  const userId = qp.get('userId') || '';
  const userName = qp.get('name') || 'User';
  if (!userId) window.location.replace('../enkore-erp.html');

  const QUOTES = [
    "Revenue is vanity, profit is sanity, cash is reality.",
    "Small steps forward still move you ahead.",
    "Build something people love.",
    "Every great company started where you are now.",
    "Focus on the process — results will follow.",
    "Your team is your greatest asset.",
    "Done is better than perfect.",
    "Take care of the customer and the numbers take care of themselves.",
    "Discipline today, freedom tomorrow.",
    "What gets measured gets managed.",
    "Cash flow is the heartbeat of every business.",
    "Slow is smooth, smooth is fast.",
    "Sell the problem you solve, not the product.",
    "A satisfied customer is the best marketing.",
    "Consistency beats intensity over time.",
    "Watch the pennies and the taka will follow.",
    "Plan the work, then work the plan.",
    "The best time to collect a due is the day it is due.",
    "Grow revenue, guard margin, keep the cash.",
    "Reputation is built in drops and lost in buckets.",
    "Every rider you serve is a story we keep moving.",
    "Quality is remembered long after price is forgotten.",
    "Progress, not perfection, every single day.",
    "Know your numbers before they surprise you.",
    "One honest sale earns ten more.",
    "Systems run the business; you run the systems.",
    "Show up, follow up, and never give up.",
    "Small margins, big volume, tight discipline.",
    "Serve first, sell second, profit third.",
    "The market rewards those who keep showing up.",
    "Turn today's effort into tomorrow's advantage.",
    "Care that keeps you moving starts with the team.",
    "Fix the leak before you pour more water.",
    "Trust is the cheapest marketing and the hardest to earn.",
    "A good day is a collected day.",
    "Momentum loves preparation."
  ];

  // open native date picker (desktop + mobile)
  window.openPicker = function(id) {
    const el = document.getElementById(id);
    if (!el) return;
    try { el.showPicker(); } catch(e) { el.focus(); }
  };

  // ── format helpers ──
  const MMM = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtDate(d) { return d.getDate()+' '+MMM[d.getMonth()]+', '+d.getFullYear(); }   // 26 Jan, 2026

  function fmt(v) {
    if (v===''||v===null||v===undefined) return '—';
    const n = Number(v);
    if (isNaN(n)) return String(v);
    return (n<0?'−':'')+Math.abs(Math.round(n)).toLocaleString('en-IN');
  }
  function tk(v) {
    const s = fmt(v);
    if (s === '—') return s;
    return '<span class="amt">'+s+'<span class="tk">tk</span></span>';
  }
  function fmtPct(v) {
    if (v===''||v===null||v===undefined) return '—';
    const n = Number(v);
    if (isNaN(n)) return String(v);
    const pct = Math.abs(n) <= 1 ? n*100 : n;
    return pct.toFixed(0)+'%';
  }
  function numClass(v) {
    const n = Number(v);
    if (isNaN(n)||n===0) return '';
    return n>0?'pos':'neg';
  }

  (function() {
    const now  = new Date();
    const h    = now.getHours();
    const wrd  = h<12?'Good Morning':h<17?'Good Afternoon':h<21?'Good Evening':'Working Late';
    const wd   = now.toLocaleDateString('en-GB',{weekday:'long'});
    const first = userName.split(' ')[0];
    document.getElementById('g-date').textContent  = wd+' · '+fmtDate(now);
    document.getElementById('g-name').textContent  = wrd + ', ' + first + ' 👋';
    const doy = Math.floor((now - new Date(now.getFullYear(),0,0)) / 86400000); // day of year → rotates daily
    document.getElementById('g-quote').textContent = '" ' + QUOTES[doy % QUOTES.length] + ' "';
  })();

  function initials(name) {
    return String(name).split(' ').filter(Boolean).map(n=>n[0]).slice(0,2).join('').toUpperCase() || '?';
  }

  function buildDash(data) {
    let h = '';
    // Insights first: what the business needs from you today, before the ledger.
    h += '<div class="section" id="ins-hero"></div>';
    h += '<div class="section" id="ins-acts"></div>';
    h += '<div class="section" id="ins-chart"></div>';
    h += '<div class="section"><div class="sec-hdr"><span class="sec-title">Year to Date (YTD)</span></div><div id="ytd-container"><div class="state"><div class="spin"></div>Computing YTD...</div></div></div>';
    h += '<div class="section"><div class="sec-hdr"><span class="sec-title">Cash in Hand</span></div><div class="cash-grid">'+
      '<div class="ccard"><div class="c-ava">MC</div><div><div class="ccard-name">Mahedi Islam Chayan</div><div class="ccard-val">'+tk(data.cash.chayan)+'</div></div></div>'+
      '<div class="ccard"><div class="c-ava">AR</div><div><div class="ccard-name">Anik Rahman</div><div class="ccard-val">'+tk(data.cash.anik)+'</div></div></div>'+
      '</div></div>';
    document.getElementById('dash-body').innerHTML = h;

    // refresh YTD, insights and P&L tiles now that expense data is here
    if (AN_ROWS.length) renderYTD();
    renderInsights();
    if (document.getElementById('d-start').value) renderAnalytics();
  }

  /* ═══════════════════════════════════════════════════════════
     INSIGHTS — runway hero, attention list, monthly trend.
     Built from data already in memory: AN_ROWS (sale lines),
     EXP_ROWS (expenses) and the Cash in Hand tab. No new sheet
     reads, so this costs nothing extra on mobile data.
     ═══════════════════════════════════════════════════════════ */
  let INS_SEL = null, INS_SERIES = [];
  const MOS3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function mKey(d){ return d.getFullYear()*12 + d.getMonth(); }
  function mLabel(k){ return MOS3[k%12]+' '+String(Math.floor(k/12)).slice(-2); }
  function shortTk(n){
    n = Number(n)||0; const s = n<0?'-':''; n = Math.abs(n);
    if (n>=1e7) return s+(n/1e7).toFixed(1).replace(/\.0$/,'')+'cr';
    if (n>=1e5) return s+(n/1e5).toFixed(1).replace(/\.0$/,'')+'L';
    if (n>=1e3) return s+Math.round(n/1e3)+'k';
    return s+Math.round(n);
  }
  function plainTk(n){ return (Number(n)||0).toLocaleString('en-IN',{maximumFractionDigits:0})+' tk'; }

  // Month-by-month P&L series from the raw rows.
  function buildSeries() {
    const map = {};
    function slot(k){ if(!map[k]) map[k]={k:k,sales:0,paid:0,pmc:0,exp:0}; return map[k]; }
    AN_ROWS.forEach(r => { const s=slot(mKey(r.d)); s.sales+=r.sales; s.paid+=r.paid; s.pmc+=r.pmc; });
    EXP_ROWS.forEach(e => { slot(mKey(e.d)).exp += e.amt; });
    const out = Object.keys(map).map(k=>map[k]).sort((a,b)=>a.k-b.k);
    out.forEach(s => { s.gp = s.paid - s.pmc; s.np = s.gp - s.exp; s.due = s.sales - s.paid; });
    return out.length > 18 ? out.slice(out.length-18) : out;
  }

  function smoothPath(p) {
    if (p.length < 2) return '';
    let d = 'M'+p[0].x.toFixed(1)+','+p[0].y.toFixed(1);
    for (let i=0;i<p.length-1;i++) {
      const p0=p[i-1]||p[i], p1=p[i], p2=p[i+1], p3=p[i+2]||p2;
      d += ' C'+(p1.x+(p2.x-p0.x)/6).toFixed(1)+','+(p1.y+(p2.y-p0.y)/6).toFixed(1)
        +' '+(p2.x-(p3.x-p1.x)/6).toFixed(1)+','+(p2.y-(p3.y-p1.y)/6).toFixed(1)
        +' '+p2.x.toFixed(1)+','+p2.y.toFixed(1);
    }
    return d;
  }
  function ring(pct, col) {
    const p = Math.max(0, Math.min(Number(pct)||0, 100)), r = 50, c = 2*Math.PI*r;
    return '<svg class="ringsvg" viewBox="0 0 114 114">'
      + '<circle class="ring-bg" cx="57" cy="57" r="'+r+'"></circle>'
      + '<circle class="ring-fg" cx="57" cy="57" r="'+r+'" style="stroke:'+col
      + ';stroke-dasharray:'+c.toFixed(1)+';stroke-dashoffset:'+(c*(1-p/100)).toFixed(1)+'"></circle></svg>';
  }

  function renderInsights() {
    if (!AN_ROWS.length || !window._expLoaded) return;
    const hero = document.getElementById('ins-hero');
    const actsEl = document.getElementById('ins-acts');
    const chartEl = document.getElementById('ins-chart');
    if (!hero || !actsEl || !chartEl) return;

    const S = buildSeries();
    INS_SERIES = S;
    if (INS_SEL != null && INS_SEL >= S.length) INS_SEL = null;
    const nowK = mKey(new Date());
    const cur = S.find(x=>x.k===nowK) || {sales:0,paid:0,pmc:0,exp:0,gp:0,np:0,due:0};
    const prev = S.find(x=>x.k===nowK-1) || null;

    const cash = (Number((window._lastCash||{}).chayan)||0) + (Number((window._lastCash||{}).anik)||0);

    // Burn: average NEGATIVE net profit over the last 3 completed months.
    const done = S.filter(x=>x.k<nowK).slice(-3);
    const avgNp = done.length ? done.reduce((t,x)=>t+x.np,0)/done.length : (cur.np||0);
    const burn = avgNp < 0 ? -avgNp : 0;
    const runway = burn > 0 ? cash/burn : null;              // null = not burning
    const runPct = runway == null ? 100 : Math.max(0, Math.min(runway/6*100, 100)); // 6 months = full ring
    const runCol = runway == null ? '#16b07c' : (runway<2 ? '#ef4444' : runway<4 ? '#f59e0b' : '#29ABE2');

    // ── HERO ──
    let hh = '<div class="hero"><div class="hero-row">'
      + '<div class="ringwrap">'+ring(runPct, runCol)
      // Past a year the exact figure stops meaning anything and the digits stop
      // fitting the ring, so it caps at 12+.
      + '<div class="ringtxt"><div class="ringv">'
      + (runway==null ? '∞' : (runway>=12 ? '12+' : (Math.round(runway*10)/10)))
      + (runway==null?'':'<span>mo</span>')+'</div><div class="ringl">runway</div></div></div>'
      + '<div class="hero-side">';
    if (runway == null) {
      hh += '<div class="hs-k">Status</div><div class="hs-v" style="color:#5fe0ad">PROFITABLE</div>'
         +  '<div class="hs-k">Avg monthly net</div><div class="hs-v2 up">'+plainTk(avgNp)+'</div>';
    } else {
      hh += '<div class="hs-k">Cash left</div><div class="hs-v">'+shortTk(cash)+'</div>'
         +  '<div class="hs-k">Burning per month</div><div class="hs-v2 dn">'+plainTk(burn)+'</div>';
    }
    hh += '<div class="hs-k">Net profit this month</div><div class="hs-v2 '+(cur.np>=0?'up':'dn')+'">'+plainTk(cur.np)+'</div>'
      + '</div></div>';
    if (runway != null) {
      hh += '<div class="hero-note'+(runway<3?' bad':'')+'">'
        + (runway<3
            ? 'At this burn the cash runs out in about '+(Math.round(runway*10)/10)+' months. Either lift collections or cut a cost line this month.'
            : 'About '+(Math.round(runway*10)/10)+' months of cash at the current burn. Watch it monthly.')
        + '</div>';
    }
    hh += '<div class="hero-foot">'
      + '<div class="hf"><div class="hf-l">Sales MTD</div><div class="hf-v">'+shortTk(cur.sales)+'</div></div>'
      + '<div class="hf"><div class="hf-l">Collected</div><div class="hf-v">'+shortTk(cur.paid)+'</div></div>'
      + '<div class="hf"><div class="hf-l">Expense</div><div class="hf-v">'+shortTk(cur.exp)+'</div></div>'
      + '</div></div>';
    hero.innerHTML = hh;

    // ── ATTENTION LIST ──
    const acts = [];
    if (runway != null && runway < 3)
      acts.push({lv:'bad', t:'Runway is '+(Math.round(runway*10)/10)+' months',
        s:plainTk(cash)+' cash against '+plainTk(burn)+' burned a month. Under three months is the point to act, not to watch.'});

    const crNow = cur.sales>0 ? cur.paid/cur.sales : null;
    const crPrev = prev && prev.sales>0 ? prev.paid/prev.sales : null;
    if (crNow != null && crPrev != null && crNow < crPrev - 0.05)
      acts.push({lv:'warn', t:'Collection rate fell to '+Math.round(crNow*100)+'%',
        s:'Down from '+Math.round(crPrev*100)+'% last month. Every point lost here is cash that stays with customers.'});

    const today = new Date();
    let aged = 0, agedRows = 0;
    AN_ROWS.forEach(r => {
      const due = r.sales - r.paid;
      if (due > 0 && (today - r.d)/86400000 > 30) { aged += due; agedRows++; }
    });
    if (aged > 0)
      acts.push({lv:'warn', t:plainTk(aged)+' receivable is over 30 days old',
        s:agedRows+' invoice line'+(agedRows===1?'':'s')+' past a month. Old dues collect slower every week they age.'});

    if (prev && prev.exp > 0 && cur.exp > prev.exp*1.4)
      acts.push({lv:'warn', t:'Expenses up '+Math.round((cur.exp/prev.exp-1)*100)+'% vs last month',
        s:plainTk(cur.exp)+' this month against '+plainTk(prev.exp)+' last month. Check what changed before it repeats.'});

    // Salesmen fading against their own recent average (no targets in this sheet).
    const bySeller = {};
    AN_ROWS.forEach(r => {
      const k = mKey(r.d);
      if (!bySeller[r.seller]) bySeller[r.seller] = {};
      bySeller[r.seller][k] = (bySeller[r.seller][k]||0) + r.sales;
    });
    const fading = [];
    Object.keys(bySeller).forEach(name => {
      if (name === '(No seller)') return;
      const hist = [nowK-3,nowK-2,nowK-1].map(k=>bySeller[name][k]||0);
      const base = hist.reduce((a,b)=>a+b,0)/3;
      const now  = bySeller[name][nowK]||0;
      if (base > 1000 && now < base*0.5) fading.push({name:name, now:now, base:base});
    });
    if (fading.length)
      acts.push({lv:'warn', t:fading.length+' salesman below half their usual pace',
        s:fading.map(f=>f.name+' at '+shortTk(f.now)+' against a '+shortTk(f.base)+' average').join(' · ')+'.'});

    const cCh = Number((window._lastCash||{}).chayan)||0, cAn = Number((window._lastCash||{}).anik)||0;
    if (cCh < 0 || cAn < 0)
      acts.push({lv:'bad', t:'Negative cash in hand recorded',
        s:'A negative balance means more was paid out or approved than recorded as received. Reconcile the Cash in Hand tab.'});

    actsEl.innerHTML = '<div class="sec-hdr"><span class="sec-title">Needs your attention</span></div>'
      + (acts.length
          ? '<div class="acts">'+acts.map((a,i)=>'<div class="act '+a.lv+'"><div class="act-n">'+(i+1)+'</div>'
              +'<div class="act-t"><b>'+a.t+'</b><span>'+a.s+'</span></div></div>').join('')+'</div>'
          : '<div class="all-clear">Nothing urgent. Cash, collections and spend are all within range.</div>');

    // ── TREND CHART ──
    chartEl.innerHTML = '<div class="sec-hdr"><span class="sec-title">Sales &amp; profit trend</span></div>'
      + insChart(S);
  }

  function insChart(S) {
    if (!S.length) return '<div class="chartcard"><div class="chart-hint">No history yet.</div></div>';
    if (S.length < 2) return '<div class="chartcard"><div class="chart-hint">One month of history so far. The trend appears from the second month.</div></div>';
    const W=320,H=124,PL=8,PR=8,PT=14,PB=20, n=S.length;
    const vals = S.map(s=>[s.sales, s.np]).flat();
    const hi = Math.max(...vals, 1), lo = Math.min(...vals, 0);
    const span = (hi-lo)||1;
    const xAt = i => PL+(W-PL-PR)*(n===1?0.5:i/(n-1));
    const yAt = v => PT+(H-PT-PB)*(1-((Number(v)||0)-lo)/span);
    const pS = S.map((s,i)=>({x:xAt(i),y:yAt(s.sales)}));
    const pN = S.map((s,i)=>({x:xAt(i),y:yAt(s.np)}));
    const base = H-PB;
    const zeroY = yAt(0);

    let svg = '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly sales and net profit">'
      + '<defs><linearGradient id="insFill" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="#29ABE2" stop-opacity=".24"/>'
      + '<stop offset="100%" stop-color="#29ABE2" stop-opacity="0"/></linearGradient></defs>'
      + '<line x1="'+PL+'" y1="'+zeroY.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+zeroY.toFixed(1)+'" stroke="#e3e8ef" stroke-width="1" stroke-dasharray="3 3"/>'
      + '<path d="'+smoothPath(pS)+' L'+pS[n-1].x.toFixed(1)+','+base+' L'+pS[0].x.toFixed(1)+','+base+' Z" fill="url(#insFill)"/>'
      + '<path d="'+smoothPath(pN)+'" fill="none" stroke="#16b07c" stroke-width="2" stroke-dasharray="4 4" stroke-linecap="round" opacity=".9"/>'
      + '<path d="'+smoothPath(pS)+'" fill="none" stroke="#29ABE2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>'
      + '<circle cx="'+pS[n-1].x.toFixed(1)+'" cy="'+pS[n-1].y.toFixed(1)+'" r="4" fill="#29ABE2" stroke="#fff" stroke-width="2"/>';

    const sel = (INS_SEL!=null && INS_SEL>=0 && INS_SEL<n) ? INS_SEL : null;
    if (sel != null) {
      svg += '<line x1="'+pS[sel].x.toFixed(1)+'" y1="'+PT+'" x2="'+pS[sel].x.toFixed(1)+'" y2="'+base+'" stroke="#29ABE2" stroke-width="1.4" stroke-dasharray="3 3" opacity=".55"/>'
        + '<circle cx="'+pN[sel].x.toFixed(1)+'" cy="'+pN[sel].y.toFixed(1)+'" r="4" fill="#16b07c" stroke="#fff" stroke-width="2"/>'
        + '<circle cx="'+pS[sel].x.toFixed(1)+'" cy="'+pS[sel].y.toFixed(1)+'" r="5.5" fill="#29ABE2" stroke="#fff" stroke-width="2.4"/>';
    }
    const slot = (W-PL-PR)/Math.max(n-1,1);
    for (let i=0;i<n;i++) {
      const x = Math.max(0, xAt(i)-slot/2);
      svg += '<rect class="hit" x="'+x.toFixed(1)+'" y="0" width="'+Math.min(slot,W-x).toFixed(1)+'" height="'+H+'" onclick="insTap('+i+')"></rect>';
    }
    svg += '<text x="'+PL+'" y="'+(H-6)+'" font-size="9" font-weight="700" fill="#b7bdc7">'+mLabel(S[0].k)+'</text>'
      + '<text x="'+(W-PR)+'" y="'+(H-6)+'" font-size="9" font-weight="700" fill="#828791" text-anchor="end">'+mLabel(S[n-1].k)+'</text>'
      + '<text x="'+(W-PR)+'" y="'+(PT-3)+'" font-size="9" font-weight="800" fill="#b7bdc7" text-anchor="end">peak '+shortTk(hi)+'</text>'
      + '</svg>';

    let detail = '';
    if (sel != null) {
      const r = S[sel], pv = sel>0 ? S[sel-1] : null;
      const cr = r.sales>0 ? Math.round(r.paid/r.sales*100) : 0;
      const dd = pv ? r.sales-pv.sales : null;
      detail = '<div class="chart-detail">'
        + '<div class="cd-hd"><span class="cd-m">'+mLabel(r.k)+'</span><span class="cd-x">tap again to close</span></div>'
        + '<div class="cd-row">'
        + '<div class="cd-b"><div class="cd-l">Sales</div><div class="cd-v" style="color:var(--blue-d)">'+shortTk(r.sales)+'</div></div>'
        + '<div class="cd-b"><div class="cd-l">Collected</div><div class="cd-v" style="color:var(--green)">'+shortTk(r.paid)+'</div></div>'
        + '<div class="cd-b"><div class="cd-l">Expense</div><div class="cd-v">'+shortTk(r.exp)+'</div></div>'
        + '<div class="cd-b"><div class="cd-l">Net</div><div class="cd-v" style="color:'+(r.np>=0?'var(--green)':'var(--red)')+'">'+shortTk(r.np)+'</div></div>'
        + '</div>'
        + '<div class="cd-note">Collection rate '+cr+'% · due '+plainTk(r.due)
        + (dd==null ? '' : (dd>=0 ? ' · '+plainTk(dd)+' more than '+mLabel(pv.k) : ' · '+plainTk(-dd)+' less than '+mLabel(pv.k)))
        + '</div></div>';
    }

    const lastNp = S[n-1].np, prevNp = S[n-2].np, dNp = lastNp-prevNp;
    return '<div class="chartcard" id="insChart">'
      + '<div class="chart-hd"><span class="chart-t">Month by month</span>'
      + '<span class="chart-s">net '+(dNp>=0?'▲ ':'▼ ')+shortTk(Math.abs(dNp))+' vs last month</span></div>'
      + svg
      + '<div class="chart-legend"><span class="l1"><i></i>Sales</span><span class="l2"><i></i>Net profit</span></div>'
      + detail
      + (sel==null ? '<div class="chart-hint">Tap any month on the graph for its details</div>' : '')
      + '</div>';
  }

  // Tap toggles: same month closes, another month switches. Only the chart
  // card is redrawn, so the page never jumps.
  function insTap(i) {
    INS_SEL = (INS_SEL===i) ? null : i;
    const el = document.getElementById('insChart');
    if (el) el.outerHTML = insChart(INS_SERIES);
  }

  // ── YTD computed live from Sale Entry rows ──
  function renderYTD() {
    if (!AN_ROWS.length) return;
    const now  = new Date();
    const ytdS = new Date(now.getFullYear(), 0, 1);   // Jan 1 of current year
    const ytdRows = AN_ROWS.filter(r => r.d >= ytdS && r.d <= now);

    let tSales = 0, tPaid = 0, tPmc = 0;
    ytdRows.forEach(r => { tSales += r.sales; tPaid += r.paid; tPmc += r.pmc; });

    const due    = tSales - tPaid;
    const clrPct = tSales ? tPaid / tSales : 0;
    const gp     = tPaid - tPmc;

    let exp = 0;
    const expReady = window._expLoaded;
    if (expReady) EXP_ROWS.forEach(e => { if (e.d >= ytdS && e.d <= now) exp += e.amt; });
    const np = gp - exp;

    const stats = [
      { lbl:'Sales',           val:tk(tSales),           cls:'blu' },
      { lbl:'Paid',            val:tk(tPaid),             cls:'pos' },
      { lbl:'Collection Rate', val:fmtPct(clrPct),       cls: clrPct>=0.8?'pos':'blu' },
      { lbl:'Due',             val:tk(due),               cls: due>0?'neg':'pos' },
      { lbl:'Gross Pft',       val:tk(gp),                cls:numClass(gp) },
      { lbl:'Expense',         val:expReady?tk(exp):'—',  cls:'' },
      { lbl:'Net Pft',         val:expReady?tk(np):'—',   cls:numClass(np) },
    ];

    const el = document.getElementById('ytd-container');
    if (!el) return;
    el.innerHTML = '<div class="ytd-grid">'+
      stats.map(s =>
        '<div class="ystat"><div class="ystat-l">'+s.lbl+'</div>'+
        '<div class="ystat-v '+s.cls+'">'+s.val+'</div></div>'
      ).join('')+
    '</div>';
  }

  // ── finance data — read live from the Central Finance sheet via gviz ──
  window._financeLoaded = false;
  window._expLoaded = false;
  let EXP_ROWS = [];

  async function gvTable(sheetId, sheetName) {
    const url = 'https://docs.google.com/spreadsheets/d/'+sheetId+
                '/gviz/tq?tqx=out:json&sheet='+encodeURIComponent(sheetName)+'&t='+Date.now();
    const txt = await fetch(url).then(r => r.text());
    const m = txt.match(/setResponse\(([\s\S]*)\)\s*;?\s*$/);
    if (!m) throw new Error('gviz parse');
    return JSON.parse(m[1]).table;
  }

  function rowVals(r) {
    const out = [];
    (r.c||[]).forEach((cell,i) => { out[i] = (cell && cell.v!==null && cell.v!==undefined) ? cell.v : ''; });
    return out;
  }

  async function loadFinance() {
    try {
      const [ct, et] = await Promise.all([
        gvTable(FIN_SHEET_ID, 'Cash in Hand'),
        gvTable(FIN_SHEET_ID, 'Expense- Helper')
      ]);

      // Expense- Helper: B(1) = Category · D(3) = Date · H(7) = Amount
      // Exclude "Raw Materials / Inventory" — already covered by COGS (PMC)
      EXP_ROWS = (et.rows||[]).map(r => {
        const c = r.c||[];
        const cat = (c[1] && c[1].v!==null && c[1].v!==undefined) ? String(c[1].v).trim() : '';
        if (cat.toLowerCase() === 'raw materials / inventory') return null;
        const d = gvDate(c[3] ? (c[3].v!==null && c[3].v!==undefined ? c[3].v : null) : null);
        if (!d) return null;
        const amt = (c[7] && c[7].v!==null && c[7].v!==undefined && c[7].v!=='') ? (Number(c[7].v)||0) : 0;
        return { d: new Date(d.getFullYear(), d.getMonth(), d.getDate()), amt: amt };
      }).filter(Boolean);
      window._expLoaded = true;

      // Cash in Hand: row where col A = "positive" · D(3) = Chayan · G(6) = Anik
      let chayan = '', anik = '';
      (ct.rows||[]).forEach(r => {
        const c = r.c||[];
        const lbl = (c[0] && c[0].v!==null && c[0].v!==undefined) ? String(c[0].v).toLowerCase().trim() : '';
        if (lbl === 'positive') {
          chayan = (c[3] && c[3].v!==null && c[3].v!==undefined) ? c[3].v : '';
          anik   = (c[6] && c[6].v!==null && c[6].v!==undefined) ? c[6].v : '';
        }
      });

      window._financeLoaded = true;
      window._lastCash = { chayan, anik };
      buildDash({ cash:{ chayan, anik } });
    } catch(e) {
      console.error(e);
      if (!window._financeLoaded) {
        document.getElementById('dash-body').innerHTML =
          '<div class="state">⚠️ Could not load finance data.<br><small>Central Finance sheet must be shared: Anyone with link · Viewer.</small></div>';
      }
    }
  }

  /* ═══════════════════════════════════════════════════════════
     SALES ANALYTICS — reads "Sale Entry - Helper" tab from
     Central Finance Sheet (FIN_SHEET_ID) via gviz
     A=Date · B=Client · J=Final Bill · M=Paid · P=Seller · R=PMC
     ═══════════════════════════════════════════════════════════ */
  let AN_ROWS = [], trendChart = null;

  function isoLocal(d) {
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }

  function gvDate(v) {
    if (v===null || v===undefined || v==='') return null;
    const s = String(v);
    let m = s.match(/Date\((\d+),(\d+),(\d+)/);
    if (m) return new Date(+m[1], +m[2], +m[3]);
    m = s.match(/^(\d{1,2})\s+([A-Za-z]+),?\s+(\d{2,4})$/);          // "1 Jan, 26"
    if (m) {
      const y = m[3].length===2 ? 2000+ +m[3] : +m[3];
      const d = new Date(m[1]+' '+m[2]+' '+y);
      return isNaN(d) ? null : d;
    }
    m = s.match(/^([A-Za-z]{3,})\s+(\d{1,2}),?\s+(\d{2,4})$/);       // "Oct 19, 25"
    if (m) {
      const y = m[3].length===2 ? 2000+ +m[3] : +m[3];
      const d = new Date(m[2]+' '+m[1]+' '+y);
      return isNaN(d) ? null : d;
    }
    m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);                // "15/10/2025" DD/MM/YYYY
    if (m) {
      const y = m[3].length===2 ? 2000+ +m[3] : +m[3];
      const d = new Date(y, +m[2]-1, +m[1]);
      return isNaN(d) ? null : d;
    }
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }

  function cellNum(c)  { return (c && c.v!==null && c.v!==undefined && c.v!=='') ? (Number(c.v)||0) : 0; }
  function cellStr(c)  { return (c && c.v!==null && c.v!==undefined) ? String(c.v).trim() : ''; }

  // Column indices (0-based) in Sale Entry - Helper tab:
  // A=0 Date · B=1 Client · J=9 Final Bill · M=12 Paid · P=15 Seller · R=17 PMC
  const SC = { date:0, client:1, sales:9, paid:12, seller:15, pmc:17 };

  async function loadAnalytics() {
    try {
      const tbl  = await gvTable(FIN_SHEET_ID, 'Sale Entry- Helper');
      const rows = (tbl.rows||[]).map(r => {
        const c = r.c||[];
        const v = rowVals(r);
        const d = gvDate(c[SC.date] ? (c[SC.date].v!==null && c[SC.date].v!==undefined ? c[SC.date].v : null) : null);
        if (!d) return null;
        return {
          d:      new Date(d.getFullYear(), d.getMonth(), d.getDate()),
          client: v[SC.client]  ? String(v[SC.client]).trim()  : '',
          sales:  v[SC.sales]  !== '' ? (Number(v[SC.sales])||0)  : 0,
          paid:   v[SC.paid]   !== '' ? (Number(v[SC.paid])||0)   : 0,
          seller: (v[SC.seller] ? String(v[SC.seller]).trim() : '') || '(No seller)',
          pmc:    v[SC.pmc]    !== '' ? (Number(v[SC.pmc])||0)    : 0
        };
      }).filter(Boolean);
      AN_ROWS = rows;
      window._anLoaded = true;
      renderYTD();
      renderInsights();
      renderAnalytics();
    } catch(e) {
      document.getElementById('an-state').innerHTML = '⚠️ Could not load sales data.';
      console.error(e);
    }
  }

  function pctOf(part, base) {
    if (!base) return '—';
    return Math.round(part/base*100)+'%';
  }

  window.renderAnalytics = function() {
    const sEl = document.getElementById('d-start');
    const eEl = document.getElementById('d-end');
    if (!sEl.value || !eEl.value) return;
    let start = new Date(sEl.value+'T00:00:00');
    let end   = new Date(eEl.value+'T00:00:00');
    if (end < start) { const t = start; start = end; end = t; }

    // formatted date pills — 26 Jan, 2026
    document.getElementById('ds-show').textContent = fmtDate(start);
    document.getElementById('de-show').textContent = fmtDate(end);

    const rows = AN_ROWS.filter(r => r.d >= start && r.d <= end);

    // daily buckets
    const dayMs = 86400000;
    const nDays = Math.round((end - start)/dayMs) + 1;
    const labels = [], fullDates = [], salesArr = [], paidArr = [];
    const idx = {};
    for (let i=0; i<nDays; i++) {
      const d = new Date(start.getTime() + i*dayMs);
      idx[isoLocal(d)] = i;
      labels.push(d.getDate()+' '+MMM[d.getMonth()]);
      fullDates.push(fmtDate(d));
      salesArr.push(0); paidArr.push(0);
    }
    let tSales = 0, tPaid = 0, tPmc = 0;
    rows.forEach(r => {
      const i = idx[isoLocal(r.d)];
      if (i===undefined) return;
      salesArr[i] += r.sales; paidArr[i] += r.paid;
      tSales += r.sales; tPaid += r.paid; tPmc += r.pmc;
    });

    // tiles
    const due = tSales - tPaid;
    document.getElementById('sc-grid').style.display = 'grid';
    document.getElementById('k-sales').innerHTML = tk(tSales);
    document.getElementById('k-coll').innerHTML  = tk(tPaid);
    const kd = document.getElementById('k-due');
    kd.innerHTML = tk(due);
    kd.className = 'gtile-v ' + (due>0 ? 'neg' : 'pos');
    document.getElementById('k-crate').textContent = tSales ? Math.round(tPaid/tSales*100)+'%' : '—';

    // day-exact P&L, cash basis (matches sheet "Actual" columns):
    // GP = Paid − PMC (COGS) · Expense = dated register · NP = GP − Expense · % against Paid
    function setTile(id, html, cls) {
      const el = document.getElementById(id);
      el.innerHTML = html;
      el.className = 'gtile-v' + (cls ? ' '+cls : '');
    }
    const gp = tPaid - tPmc;
    setTile('k-gp',  tk(gp),            numClass(gp));
    setTile('k-gpp', pctOf(gp, tPaid),  numClass(gp));
    if (window._expLoaded) {
      let exp = 0;
      EXP_ROWS.forEach(e => { if (e.d >= start && e.d <= end) exp += e.amt; });
      const np = gp - exp;
      setTile('k-exp', tk(exp),           '');
      setTile('k-np',  tk(np),            numClass(np));
      setTile('k-npp', pctOf(np, tPaid),  numClass(np));
    } else {
      ['k-exp','k-np','k-npp'].forEach(id => setTile(id,'—',''));
    }

    // chart — dark panel styling
    document.getElementById('an-state').style.display = 'none';
    const cv = document.getElementById('trendChart');
    cv.style.display = 'block';
    if (trendChart) trendChart.destroy();
    trendChart = new Chart(cv, {
      data: {
        labels: labels,
        datasets: [
          { type:'bar',  label:'Sales',      data:salesArr,
            backgroundColor:'rgba(99,205,255,0.55)', hoverBackgroundColor:'rgba(99,205,255,0.85)',
            borderRadius:4, order:2 },
          { type:'line', label:'Collection', data:paidArr,
            borderColor:'#3fe0a8', backgroundColor:'rgba(63,224,168,0.12)',
            fill:true, tension:0.35, pointRadius:2, pointHoverRadius:5,
            pointBackgroundColor:'#3fe0a8', borderWidth:2, order:1 }
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false, animation:false,
        interaction:{ mode:'index', intersect:false },
        plugins:{
          legend:{ labels:{ boxWidth:10, color:'rgba(255,255,255,.75)', font:{ family:'Inter', size:10, weight:'700' } } },
          tooltip:{
            backgroundColor:'#0d1b29', titleColor:'#fff', bodyColor:'rgba(255,255,255,.8)',
            callbacks:{
              title: items => items.length ? fullDates[items[0].dataIndex] : '',
              label: ctx => ' '+ctx.dataset.label+': '+fmt(ctx.parsed.y)+' tk'
            }
          }
        },
        scales:{
          x:{ grid:{ display:false }, ticks:{ color:'rgba(255,255,255,.5)', font:{ family:'Inter', size:9 }, maxRotation:0, autoSkip:true, maxTicksLimit:8 } },
          y:{ beginAtZero:true, grid:{ color:'rgba(255,255,255,.07)' }, ticks:{ color:'rgba(255,255,255,.5)', font:{ family:'Inter', size:9 }, callback:v => v>=1000 ? (v/1000)+'k' : v } }
        }
      }
    });

    // salesman table
    const by = {};
    rows.forEach(r => {
      const k = r.seller;
      if (!by[k]) by[k] = { sales:0, paid:0, clients:new Set() };
      by[k].sales += r.sales;
      by[k].paid  += r.paid;
      if (r.client) by[k].clients.add(r.client.toLowerCase());
    });
    const sellers = Object.keys(by).sort((a,b) => by[b].sales - by[a].sales);

    function ratePill(sales, paid) {
      if (!sales) return '<span class="rate-pill rate-mid">—</span>';
      const p = Math.round(paid/sales*100);
      const cls = p>=80 ? 'rate-hi' : p>=50 ? 'rate-mid' : 'rate-lo';
      return '<span class="rate-pill '+cls+'">'+p+'%</span>';
    }
    function dueCell(v) {
      if (v===0) return '<td>0</td>';
      const inner = '<span class="amt">'+fmt(v)+'<span class="tk">tk</span></span>';
      return v>0 ? '<td class="neg-t">'+inner+'</td>' : '<td class="pos-t">'+inner+'</td>';
    }

    let h = '<thead><tr><th>Seller</th><th>Sales</th><th>Coll.</th><th>Due</th><th>Collection Rate</th><th>Clients</th></tr></thead><tbody>';
    let totC = new Set();
    sellers.forEach(k => {
      const o = by[k];
      o.clients.forEach(c => totC.add(c));
      h += '<tr>'+
        '<td><div class="seller-cell"><div class="s-ava">'+initials(k)+'</div><span class="s-name">'+k+'</span></div></td>'+
        '<td>'+tk(o.sales)+'</td>'+
        '<td>'+tk(o.paid)+'</td>'+
        dueCell(o.sales - o.paid)+
        '<td>'+ratePill(o.sales, o.paid)+'</td>'+
        '<td>'+o.clients.size+'</td>'+
      '</tr>';
    });
    h += '<tr class="tot">'+
      '<td>Total</td><td>'+tk(tSales)+'</td><td>'+tk(tPaid)+'</td>'+
      dueCell(due)+'<td>'+ratePill(tSales, tPaid)+'</td><td>'+totC.size+'</td>'+
    '</tr></tbody>';
    document.getElementById('perf-tbl').innerHTML = h;
    document.getElementById('perf-section').style.display = 'block';
  };

  (function initAnalytics() {
    const now   = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const sEl = document.getElementById('d-start');
    const eEl = document.getElementById('d-end');
    sEl.value = isoLocal(first);
    eEl.value = isoLocal(now);
    sEl.max = isoLocal(now);
    eEl.max = isoLocal(now);
    document.getElementById('ds-show').textContent = fmtDate(first);
    document.getElementById('de-show').textContent = fmtDate(now);
  })();

  // ── STALE-WHILE-REVALIDATE (1-hour freshness) ──
  // Show the last loaded data instantly; only pull fresh live data (with a
  // minimal top bar) when the cache is older than one hour.
  const DASH_CACHE_KEY = 'enkore_dash_cache_v1';
  let _dashRefreshing = false;

  function saveDashCache() {
    if (!window._financeLoaded || !window._anLoaded) return; // cache only a complete load
    try {
      localStorage.setItem(DASH_CACHE_KEY, JSON.stringify({
        ts:   Date.now(),
        cash: window._lastCash || { chayan:'', anik:'' },
        exp:  EXP_ROWS.map(e => ({ d: e.d.getTime(), amt: e.amt })),
        an:   AN_ROWS.map(r => ({ d: r.d.getTime(), client:r.client, sales:r.sales, paid:r.paid, seller:r.seller, pmc:r.pmc }))
      }));
    } catch(_) {}
  }

  function hydrateDashCache() {
    let c;
    try { c = JSON.parse(localStorage.getItem(DASH_CACHE_KEY) || 'null'); } catch(_) { c = null; }
    if (!c || !c.ts) return null;
    EXP_ROWS = (c.exp||[]).map(e => ({ d: new Date(e.d), amt: e.amt }));
    AN_ROWS  = (c.an ||[]).map(r => ({ d: new Date(r.d), client:r.client, sales:r.sales, paid:r.paid, seller:r.seller, pmc:r.pmc }));
    window._expLoaded = true; window._financeLoaded = true; window._anLoaded = true;
    window._lastCash = c.cash || { chayan:'', anik:'' };
    buildDash({ cash: window._lastCash });
    renderYTD();
    renderAnalytics();
    return c.ts;
  }

  async function refreshDashLive() {
    if (_dashRefreshing) return;
    _dashRefreshing = true;
    await Promise.allSettled([loadFinance(), loadAnalytics()]);
    saveDashCache();
    _dashRefreshing = false;
  }

  (function startDashboard() {
    const loginToken = sessionStorage.getItem('erp_login_token') || '';
    const doneToken  = sessionStorage.getItem('dash_refreshed_token') || '';
    const ts = hydrateDashCache();
    // Reveal now — cached content (or the first-load spinner) is painted in one step.
    document.body.classList.add('booted');
    if (ts === null) {
      refreshDashLive();                              // first ever load — full-screen loaders showing
    } else if (loginToken && loginToken !== doneToken) {
      forceRefresh();                                 // fresh login — auto-refresh once, cached shown meanwhile
    }
    // else (same session, cache present): show as-is; pull down for the latest
    if (loginToken) sessionStorage.setItem('dash_refreshed_token', loginToken);
  })();
  // Safety net: never leave the page cloaked if something above throws.
  window.addEventListener('load', function(){ document.body.classList.add('booted'); });

  // ── PULL TO REFRESH / AUTO REFRESH (manual + on login) ──
  async function forceRefresh() {
    const ind = document.getElementById('ptrIndicator');
    ind.style.marginTop = '0px';
    ind.classList.add('ptr-loading');
    document.getElementById('ptrText').textContent = 'Refreshing…';
    await refreshDashLive();
    ind.classList.remove('ptr-loading');
    document.getElementById('ptrText').textContent = 'Pull to refresh';
    ind.style.marginTop = '-60px';
  }

  (function initPullToRefresh() {
    const ind = document.getElementById('ptrIndicator');
    const txt = document.getElementById('ptrText');
    const MAX = 84, FIRE = 58;
    let startY = 0, pulling = false, dist = 0;
    document.addEventListener('touchstart', e => {
      if (_dashRefreshing || window.scrollY > 0) { pulling = false; return; }
      startY = e.touches[0].clientY; pulling = true;
    }, { passive:true });
    document.addEventListener('touchmove', e => {
      if (!pulling || _dashRefreshing) return;
      dist = e.touches[0].clientY - startY;
      if (dist <= 0) { dist = 0; ind.style.marginTop = '-60px'; return; }
      if (window.scrollY > 0) { pulling = false; return; }
      const eased = Math.min(MAX, dist * 0.5);
      ind.style.marginTop = (eased - 52) + 'px';
      txt.textContent = eased >= FIRE ? 'Release to refresh' : 'Pull to refresh';
    }, { passive:true });
    document.addEventListener('touchend', () => {
      if (!pulling) return;
      pulling = false;
      const eased = Math.min(MAX, dist * 0.5);
      if (eased >= FIRE) forceRefresh();
      else ind.style.marginTop = '-60px';
      dist = 0;
    });
  })();
</script>
